<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Pour-Over Master Tracker</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #2c2522;
            --text-muted: #786f6a;
            --accent: #8b5a2b;
            --accent-hover: #6f4520;
            --border-color: #e3ded5;
            --shadow: 0 4px 16px rgba(44, 37, 34, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 40px;
        }

        /* Navigation Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        .step-panel {
            display: none;
        }

        .step-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            background: var(--border-color);
            cursor: not-allowed;
        }

        /* Timer UI */
        .timer-display-box {
            text-align: center;
            padding: 24px 0;
            background: #faf8f5;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        #timer-clock {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        #timer-stage-indicator {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
        }

        #timer-status-instruction {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Compound Multi-Colored Bar */
        .compound-bar-wrapper {
            margin: 20px 0;
        }

        .compound-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        #compound-bar-container {
            display: flex;
            height: 12px;
            width: 100%;
            background: var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            gap: 2px;
        }

        .bar-segment {
            height: 100%;
            transition: width 0.3s ease;
        }

        /* Suggestion Card */
        .suggestion-card {
            background: #fff8f0;
            border-left: 4px solid var(--accent);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        /* Grouped History Cards */
        .grouped-history-card {
            position: relative;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
            font-size: 0.85rem;
        }

        .history-score-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #faf8f5;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .grouped-history-card h3 {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 4px;
            padding-right: 60px;
        }

        .history-section-divider {
            border-top: 1px dashed var(--border-color);
            margin: 10px 0;
            padding-top: 8px;
        }

        .item-card {
            position: relative;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            background: #fff;
            transition: opacity 0.2s, background 0.2s;
        }

        .item-card.archived {
            background: #f0ede6;
            opacity: 0.65;
        }

        .item-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding-right: 45px;
        }

        .item-card-header strong {
            color: var(--accent);
            font-size: 0.95rem;
        }

        .badge {
            font-size: 0.7rem;
            background: #faf8f5;
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .card-actions button {
            margin-top: 0;
            padding: 6px 10px;
            font-size: 0.8rem;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .card-actions button:hover {
            background: var(--accent);
            color: white;
        }

        .card-actions button.danger {
            color: #7d6b5e;
            border-color: #bfaea2;
        }

        .card-actions button.danger:hover {
            background: #7d6b5e;
            color: white;
        }

        /* Calendar View Specific Styles */
        .history-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .history-top-bar h2 {
            font-size: 1.05rem;
            color: var(--accent);
        }

        .icon-btn-toggle {
            background: #faf8f5;
            border: 1px solid var(--border-color);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0;
            width: auto;
        }

        .icon-btn-toggle:hover {
            background: var(--accent);
            color: white;
        }

        .calendar-nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #faf8f5;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 14px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .calendar-nav-row button {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            margin-top: 0;
            width: auto;
        }

        .calendar-nav-row button:hover {
            background: var(--accent);
            color: white;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 16px;
            text-align: center;
        }

        .cal-day-header {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            padding-bottom: 4px;
        }

        .cal-cell {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 2px;
            font-size: 0.8rem;
            cursor: pointer;
            min-height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .cal-cell:hover {
            border-color: var(--accent);
        }

        .cal-cell.other-month {
            opacity: 0.3;
            background: #faf8f5;
        }

        .cal-cell.selected {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .cal-cell.selected .cal-dot {
            background: white;
        }

        .cal-cell.selected span {
            color: white;
        }

        .cal-dot {
            width: 5px;
            height: 5px;
            background: var(--accent);
            border-radius: 50%;
            margin-top: 4px;
        }

        /* Taster Profile Dashboard Stats */
        .profile-stat-box {
            background: #faf8f5;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
            font-size: 0.85rem;
        }

        .profile-stat-box h3 {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .ranked-list {
            padding-left: 18px;
            margin-top: 4px;
        }

        .ranked-list li {
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>Precision Pour-Over</h1>
        <div class="nav-links">
            <a id="nav-brew" onclick="attemptNav(1)" class="active">Brew</a>
            <a id="nav-beans" onclick="attemptNav(5)">Beans</a>
            <a id="nav-profile" onclick="attemptNav(6)">Profile</a>
            <a id="nav-history" onclick="attemptNav(4)">History</a>
        </div>
    </div>

    <!-- STEP 1: BREW PARAMETERS -->
    <div id="step-1" class="step-panel active">
        <div class="form-group">
            <label>Bean Selection</label>
            <select id="bean-select" onchange="checkBeanSelect()">
                <option value="" disabled selected>-- Select a Bean Profile --</option>
                <option value="new">+ Add New Bean Profile</option>
            </select>
        </div>

        <div id="new-bean-section" style="display: none; background: #faf8f5; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color);">
            <div class="form-group">
                <label>Name (e.g. Yirgacheffe)</label>
                <input type="text" id="bean-name" placeholder="e.g. Yirgacheffe">
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Bean Origin</label>
                    <input type="text" id="bean-origin" placeholder="e.g. Ethiopia">
                </div>
                <div class="form-group">
                    <label>Roastery / Café (Optional)</label>
                    <input type="text" id="bean-roastery" placeholder="e.g. Onyx Coffee Lab">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Roast Level</label>
                    <select id="bean-roast">
                        <option value="Light">Light</option>
                        <option value="Medium-Light">Medium-Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Medium-Dark">Medium-Dark</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Flavour Profile Tag</label>
                    <select id="bean-flavor-type">
                        <option value="Fruity">Fruity</option>
                        <option value="Nutty">Nutty</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 8px;">
                <label>Specific Tasting Notes (comma separated)</label>
                <input type="text" id="bean-flavor" placeholder="e.g. Peach, Chocolate, Vanilla">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Grind Setting (Clicks)</label>
                <input type="number" id="param-grind" value="21">
            </div>
            <div class="form-group">
                <label>Water Temp (°C)</label>
                <input type="number" id="param-temp" value="92">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Coffee Dose (g)</label>
                <input type="number" id="param-coffee" value="15">
            </div>
            <div class="form-group">
                <label>Water Weight (g)</label>
                <input type="number" id="param-water" value="250">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Use Bloom Phase?</label>
                <select id="param-bloom">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="form-group">
                <label>Number of Pours</label>
                <input type="number" id="param-pours" value="3">
            </div>
        </div>

        <button onclick="startTimerSetup()" id="proceed-brew-btn" disabled>Proceed to Stopwatch</button>
    </div>

    <!-- STEP 2: MANUAL CHECKPOINT STOPWATCH -->
    <div id="step-2" class="step-panel">
        <div class="timer-display-box">
            <div id="timer-clock">0:00</div>
            <div id="timer-stage-indicator">Stage: Ready</div>
            <div id="timer-status-instruction">Tap below to initiate sequence</div>
        </div>

        <div class="compound-bar-wrapper">
            <div class="compound-bar-label">
                <span>Phase Breakdown Distribution</span>
                <span id="total-logged-time">0s total</span>
            </div>
            <div id="compound-bar-container">
                <div class="bar-segment" style="width: 100%; background: var(--border-color); opacity: 0.4;"></div>
            </div>
        </div>

        <button id="timer-action-btn" onclick="handlePourOrFinishPress()">Start Bloom</button>
        <button onclick="attemptNav(1)" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: 8px;">Cancel / Edit Params</button>
    </div>

    <!-- STEP 3: RATING & OPTIMIZATION TIPS -->
    <div id="step-3" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Brew Complete Analysis & Tips</h2>
        
        <div id="analytics-suggestions-box"></div>

        <div class="form-group">
            <label>Overall Cup Score (1 - 10)</label>
            <input type="number" id="cup-score" min="1" max="10" value="8" step="0.1">
        </div>

        <div class="form-group">
            <label>Specific Tasting Notes (comma separated)</label>
            <textarea id="cup-notes" rows="3" placeholder="Peach, floral, clean finish..."></textarea>
        </div>

        <button onclick="saveBrewSession()">Save & Return to Brew</button>
    </div>

    <!-- STEP 4: HISTORY -->
    <div id="step-4" class="step-panel">
        <div class="history-top-bar">
            <h2 id="history-header-title">Logged Brew History</h2>
            <button class="icon-btn-toggle" id="history-view-toggle-btn" onclick="toggleHistoryView()">📅 Calendar</button>
        </div>
        <div id="history-content-container"></div>
        <button onclick="attemptNav(1)" style="margin-top: 16px;">Back to Brew</button>
    </div>

    <!-- STEP 5: BEAN INVENTORY -->
    <div id="step-5" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Bean Inventory</h2>
        
        <div style="background: #faf8f5; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color);">
            <div class="form-group" style="margin-bottom: 10px;">
                <label id="mgr-form-title">Add New Bean Inventory</label>
                <input type="text" id="mgr-name" placeholder="Name (e.g. Yirgacheffe)">
            </div>
            <div class="row" style="margin-bottom: 10px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Bean Origin</label>
                    <input type="text" id="mgr-origin" placeholder="e.g. Ethiopia">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Roastery / Café (Optional)</label>
                    <input type="text" id="mgr-roastery" placeholder="e.g. Onyx">
                </div>
            </div>
            <div class="row" style="margin-bottom: 10px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Roast Level</label>
                    <select id="mgr-roast">
                        <option value="Light">Light</option>
                        <option value="Medium-Light">Medium-Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Medium-Dark">Medium-Dark</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Flavour Profile Tag</label>
                    <select id="mgr-flavor-type">
                        <option value="Fruity">Fruity</option>
                        <option value="Nutty">Nutty</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 8px;">
                <label>Specific Tasting Notes</label>
                <input type="text" id="mgr-flavor" placeholder="e.g. Peach, Chocolate">
            </div>
            <input type="hidden" id="mgr-edit-id" value="">
            <button onclick="saveBeanFromManager()" id="mgr-save-btn" style="margin-top: 10px;">Save Bean Profile</button>
            <button id="mgr-cancel-btn" onclick="resetBeanManagerForm()" style="display:none; background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: 6px;">Cancel Edit</button>
        </div>

        <div id="bean-manager-list"></div>
        <button onclick="attemptNav(1)" style="margin-top: 16px;">Back to Brew</button>
    </div>

    <!-- STEP 6: COFFEE TASTER PROFILE DASHBOARD -->
    <div id="step-6" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Coffee Taster Profile & Preferences</h2>
        <div id="taster-profile-content"></div>
        <button onclick="attemptNav(1)" style="margin-top: 16px;">Back to Brew</button>
    </div>
</div>

<script>
    const db = {
        beans: JSON.parse(localStorage.getItem('pour_over_beans')) || [],
        sessions: JSON.parse(localStorage.getItem('pour_over_sessions')) || []
    };

    function persistData() {
        localStorage.setItem('pour_over_beans', JSON.stringify(db.beans));
        localStorage.setItem('pour_over_sessions', JSON.stringify(db.sessions));
    }

    let activeBrew = {};
    let brewPhases = [];
    let currentPhaseIndex = 0;
    let currentPhaseSeconds = 0;
    let stopwatchSeconds = 0;
    let stopwatchInterval = null;
    let isStopwatchRunning = false;
    let currentStep = 1;

    // History View State
    let isCalendarView = false;
    let calendarCurrentDate = new Date();
    let selectedCalendarDateStr = new Date().toLocaleDateString();

    window.addEventListener('beforeunload', (e) => {
        if (isStopwatchRunning || currentStep === 2) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    function attemptNav(stepNum) {
        if (currentStep === 2 && stepNum !== 2) {
            if (!confirm("Are you sure you want to leave? Active timer will be lost.")) return;
            if (stopwatchInterval) clearInterval(stopwatchInterval);
            isStopwatchRunning = false;
        }
        goToStep(stepNum);
    }

    function goToStep(stepNum) {
        currentStep = stepNum;
        document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`step-${stepNum}`).classList.add('active');

        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        if (stepNum === 1 || stepNum === 2 || stepNum === 3) document.getElementById('nav-brew').classList.add('active');
        if (stepNum === 5) document.getElementById('nav-beans').classList.add('active');
        if (stepNum === 6) document.getElementById('nav-profile').classList.add('active');
        if (stepNum === 4) document.getElementById('nav-history').classList.add('active');

        if (stepNum === 1) updateBeanSelectDropdown();
        if (stepNum === 2) initStopwatchSession();
        if (stepNum === 4) renderHistoryContent();
        if (stepNum === 5) renderBeanManager();
        if (stepNum === 6) renderTasterProfile();
    }

    function updateBeanSelectDropdown() {
        const select = document.getElementById('bean-select');
        select.innerHTML = '<option value="" disabled selected>-- Select a Bean Profile --</option>';
        db.beans.filter(b => !b.archived).forEach((b) => {
            const opt = document.createElement('option');
            opt.value = b.id || ('b_legacy_' + Math.random());
            opt.textContent = `${b.name} (${b.origin || 'Unknown Origin'}) - ${b.roast}`;
            select.appendChild(opt);
        });
        select.innerHTML += '<option value="new">+ Add New Bean Profile</option>';
        checkBeanSelect();
    }

    function checkBeanSelect() {
        const val = document.getElementById('bean-select').value;
        document.getElementById('new-bean-section').style.display = (val === 'new') ? 'block' : 'none';
        document.getElementById('proceed-brew-btn').disabled = (val === '');
    }

    function startTimerSetup() {
        if (document.getElementById('bean-select').value === '') return;
        goToStep(2);
    }

    function renderBeanManager() {
        const container = document.getElementById('bean-manager-list');
        container.innerHTML = db.beans.length === 0 ? '<p style="font-size: 0.85rem; color: var(--text-muted);">No beans added.</p>' : '';
        
        const sortedBeans = [...db.beans].sort((a, b) => (a.archived === b.archived ? 0 : a.archived ? 1 : -1));

        sortedBeans.forEach((b, index) => {
            const roasteryText = b.roastery ? ` | ${b.roastery}` : '';
            const hasId = !!b.id;
            
            let actionButtons = '';
            if (hasId) {
                actionButtons = `
                    <button onclick="editBean('${b.id}')">Edit</button>
                    <button onclick="toggleArchiveBean('${b.id}')" class="danger">${b.archived ? 'Unarchive' : 'Archive'}</button>
                `;
            } else {
                actionButtons = `
                    <button onclick="fixAndEditLegacyBean(${index})">Assign ID & Edit</button>
                    <button onclick="toggleArchiveLegacyBean(${index})" class="danger">${b.archived ? 'Unarchive' : 'Archive'}</button>
                `;
            }

            container.innerHTML += `
                <div class="item-card ${b.archived ? 'archived' : ''}">
                    <div class="item-card-header"><strong>${b.name}</strong><span class="badge">${b.roast} - ${b.flavorType || 'Fruity'}</span></div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">Origin: ${b.origin || 'Unknown'}${roasteryText}</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">Notes: ${b.flavor || 'None'}</div>
                    ${!hasId ? '<div style="font-size: 0.75rem; color: #b45309; margin-top: 4px;">⚠️ Legacy bean format (missing ID)</div>' : ''}
                    <div class="card-actions">
                        ${actionButtons}
                    </div>
                </div>
            `;
        });
    }

    function fixAndEditLegacyBean(arrayIndex) {
        db.beans[arrayIndex].id = 'b_' + Date.now() + '_' + arrayIndex;
        persistData();
        editBean(db.beans[arrayIndex].id);
    }

    function toggleArchiveLegacyBean(arrayIndex) {
        if (!db.beans[arrayIndex].id) {
            db.beans[arrayIndex].id = 'b_' + Date.now() + '_' + arrayIndex;
        }
        toggleArchiveBean(db.beans[arrayIndex].id);
    }

    function saveBeanFromManager() {
        const name = document.getElementById('mgr-name').value.trim();
        const origin = document.getElementById('mgr-origin').value.trim();
        const roastery = document.getElementById('mgr-roastery').value.trim();
        const roast = document.getElementById('mgr-roast').value;
        const flavorType = document.getElementById('mgr-flavor-type').value;
        const flavor = document.getElementById('mgr-flavor').value.trim();
        const editId = document.getElementById('mgr-edit-id').value;

        if (!name) return alert('Name required.');
        if (!editId) {
            db.beans.push({ id: 'b_' + Date.now(), name, origin, roastery, roast, flavorType, flavor, archived: false });
        } else {
            const b = db.beans.find(x => x.id === editId);
            if (b) {
                Object.assign(b, { name, origin, roastery, roast, flavorType, flavor });
            }
        }
        persistData();
        resetBeanManagerForm();
        renderBeanManager();
    }

    function editBean(id) {
        const b = db.beans.find(x => x.id === id);
        if (!b) return;
        document.getElementById('mgr-name').value = b.name;
        document.getElementById('mgr-origin').value = b.origin || '';
        document.getElementById('mgr-roastery').value = b.roastery || '';
        document.getElementById('mgr-roast').value = b.roast;
        document.getElementById('mgr-flavor-type').value = b.flavorType || 'Fruity';
        document.getElementById('mgr-flavor').value = b.flavor || '';
        document.getElementById('mgr-edit-id').value = id;
        document.getElementById('mgr-form-title').textContent = 'Edit Bean Profile';
        document.getElementById('mgr-save-btn').textContent = 'Update Bean Profile';
        document.getElementById('mgr-cancel-btn').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetBeanManagerForm() {
        document.getElementById('mgr-name').value = '';
        document.getElementById('mgr-origin').value = '';
        document.getElementById('mgr-roastery').value = '';
        document.getElementById('mgr-flavor').value = '';
        document.getElementById('mgr-edit-id').value = '';
        document.getElementById('mgr-form-title').textContent = 'Add New Bean Inventory';
        document.getElementById('mgr-save-btn').textContent = 'Save Bean Profile';
        document.getElementById('mgr-cancel-btn').style.display = 'none';
    }

    function toggleArchiveBean(id) {
        const b = db.beans.find(x => x.id === id);
        if (b) {
            b.archived = !b.archived;
            persistData();
            renderBeanManager();
        }
    }

    function initStopwatchSession() {
        const val = document.getElementById('bean-select').value;
        let matchedBean = null;
        if (val === 'new') {
            const name = document.getElementById('bean-name').value.trim() || 'Yirgacheffe';
            const origin = document.getElementById('bean-origin').value.trim() || 'Ethiopia';
            const roastery = document.getElementById('bean-roastery').value.trim();
            const roast = document.getElementById('bean-roast').value;
            const flavorType = document.getElementById('bean-flavor-type').value;
            const flavor = document.getElementById('bean-flavor').value;
            matchedBean = { id: 'b_' + Date.now(), name, origin, roastery, roast, flavorType, flavor, archived: false };
            db.beans.push(matchedBean);
        } else {
            matchedBean = db.beans.find(x => x.id === val);
        }
        
        activeBrew.beanName = matchedBean ? matchedBean.name : 'Unknown';
        activeBrew.origin = matchedBean && matchedBean.origin ? matchedBean.origin : 'Unknown';
        activeBrew.roastery = matchedBean && matchedBean.roastery ? matchedBean.roastery : '';
        activeBrew.roast = matchedBean ? matchedBean.roast : 'Medium';
        activeBrew.flavorType = matchedBean && matchedBean.flavorType ? matchedBean.flavorType : 'Fruity';
        activeBrew.grind = document.getElementById('param-grind').value;
        activeBrew.temp = document.getElementById('param-temp').value;
        activeBrew.coffee = document.getElementById('param-coffee').value;
        activeBrew.water = document.getElementById('param-water').value;
        activeBrew.bloom = document.getElementById('param-bloom').value;
        activeBrew.pours = document.getElementById('param-pours').value;
        
        brewPhases = [{name: 'Bloom', duration: 0, color: '#8b5a2b'}];
        for(let i=0; i<parseInt(activeBrew.pours); i++) brewPhases.push({name: 'Pour '+ (i+1), duration: 0, color: '#c29b61'});
        brewPhases.push({name: 'Drawdown', duration: 0, color: '#d4b58a'});

        currentPhaseIndex = 0; currentPhaseSeconds = 0; stopwatchSeconds = 0; isStopwatchRunning = false;
    }

    function handlePourOrFinishPress() {
        if (!isStopwatchRunning) {
            isStopwatchRunning = true;
            stopwatchInterval = setInterval(() => {
                stopwatchSeconds++;
                currentPhaseSeconds++;
                document.getElementById('timer-clock').textContent = Math.floor(stopwatchSeconds/60) + ':' + (stopwatchSeconds%60).toString().padStart(2,'0');
            }, 1000);
            document.getElementById('timer-action-btn').textContent = 'Next Stage';
        } else if (currentPhaseIndex < brewPhases.length - 1) {
            brewPhases[currentPhaseIndex].duration = currentPhaseSeconds;
            currentPhaseSeconds = 0;
            currentPhaseIndex++;
            document.getElementById('timer-stage-indicator').textContent = 'Stage: ' + brewPhases[currentPhaseIndex].name;
        } else {
            clearInterval(stopwatchInterval);
            isStopwatchRunning = false;
            generateSuggestions(activeBrew);
            goToStep(3);
        }
    }

    function generateSuggestions(brew) {
        let tip = "Your parameters look well balanced. Keep track of extraction time to ensure even drawdown.";
        const score = parseFloat(brew.score) || 8;
        const grind = parseInt(brew.grind);
        const temp = parseInt(brew.temp);

        if (score < 7) {
            if (grind < 20) {
                tip = "<strong>Optimization Tip:</strong> Cup score was low with a fine grind. Try coarser clicks (e.g. 23-25) to reduce over-extraction bitterness.";
            } else {
                tip = "<strong>Optimization Tip:</strong> Consider increasing water temperature by 1-2°C or grinding slightly finer to boost extraction yield.";
            }
        } else {
            tip = `<strong>Great Brew!</strong> Your grind setting of ${grind} clicks and ${temp}°C water worked nicely. Replicate these parameters for consistency.`;
        }
        document.getElementById('analytics-suggestions-box').innerHTML = `<div class="suggestion-card">${tip}</div>`;
    }

    function saveBrewSession() {
        activeBrew.score = parseFloat(document.getElementById('cup-score').value) || 8;
        activeBrew.notes = document.getElementById('cup-notes').value;
        activeBrew.date = new Date().toLocaleDateString();
        db.sessions.unshift(activeBrew);
        persistData();
        goToStep(1);
    }

    // History Views Management
    function toggleHistoryView() {
        isCalendarView = !isCalendarView;
        const toggleBtn = document.getElementById('history-view-toggle-btn');
        toggleBtn.textContent = isCalendarView ? '📋 List' : '📅 Calendar';
        renderHistoryContent();
    }

    function renderHistoryContent() {
        if (isCalendarView) {
            document.getElementById('history-header-title').textContent = 'Calendar Log';
            renderCalendarView();
        } else {
            document.getElementById('history-header-title').textContent = 'Logged Brew History';
            renderHistoryList();
        }
    }

    function renderHistoryList() {
        const container = document.getElementById('history-content-container');
        if (db.sessions.length === 0) {
            container.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted);">No brew sessions logged yet.</p>';
            return;
        }

        const grouped = {};
        db.sessions.forEach((s, idx) => {
            const profileKey = `${s.beanName}|${s.origin}|${s.roastery}|${s.roast}|${s.flavorType}`;
            if (!grouped[profileKey]) {
                grouped[profileKey] = {
                    beanName: s.beanName,
                    roastery: s.roastery || '',
                    sessions: []
                };
            }
            grouped[profileKey].sessions.push({ ...s, originalIndex: idx });
        });

        const sortedGroups = Object.values(grouped).map(group => {
            const totalCups = group.sessions.length;
            const avgScore = parseFloat((group.sessions.reduce((acc, curr) => acc + curr.score, 0) / totalCups).toFixed(1));
            return { ...group, avgScore };
        }).sort((a, b) => b.avgScore - a.avgScore);

        let html = '';
        sortedGroups.forEach(group => {
            const sessions = group.sessions;
            const totalCups = sessions.length;
            const avgScore = group.avgScore;
            const bestCup = sessions.reduce((best, curr) => curr.score > best.score ? curr : best, sessions[0]);
            
            let suggestion = "Maintain these parameters for consistent flavor extraction.";
            if (bestCup.score < 7.5) {
                suggestion = "Consider adjusting grind size or water temperature to pull cleaner notes out of this bean profile.";
            } else {
                suggestion = `Best results achieved at grind setting ${bestCup.grind} clicks with ${bestCup.temp}°C water.`;
            }

            const headerTitle = group.roastery ? `${group.beanName} (${group.roastery})` : group.beanName;

            html += `
                <div class="grouped-history-card">
                    <div class="history-score-badge">${avgScore}</div>
                    <h3>${headerTitle}</h3>
                    
                    <div class="history-section-divider" style="border-top: none; margin-top: 6px; padding-top: 4px;">
                        <strong>No. of Cups:</strong> ${totalCups}<br>
                        <strong>⭐ Best Cup Stats:</strong> Score: ${bestCup.score}/10 | Grind: ${bestCup.grind} clicks | Temp: ${bestCup.temp}°C<br>
                        <span style="color: var(--text-muted);">Notes: ${bestCup.notes || 'None recorded'} (${bestCup.date})</span>
                    </div>

                    <div class="history-section-divider">
                        <strong>💡 Suggestion for Better Brew:</strong><br>
                        <span style="color: var(--text-muted);">${suggestion}</span>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function renderCalendarView() {
        const container = document.getElementById('history-content-container');
        const year = calendarCurrentDate.getFullYear();
        const month = calendarCurrentDate.getMonth();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        let html = `
            <div class="calendar-nav-row">
                <button onclick="changeCalendarMonth(-1)">◀ Prev</button>
                <span>${monthNames[month]} ${year}</span>
                <button onclick="changeCalendarMonth(1)">Next ▶</button>
            </div>
            <div class="calendar-grid">
                <div class="cal-day-header">Su</div>
                <div class="cal-day-header">Mo</div>
                <div class="cal-day-header">Tu</div>
                <div class="cal-day-header">We</div>
                <div class="cal-day-header">Th</div>
                <div class="cal-day-header">Fr</div>
                <div class="cal-day-header">Sa</div>
        `;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const prevTotalDays = new Date(year, month, 0).getDate();

        // Map logs by date string for easy dot check
        const logsByDate = {};
        db.sessions.forEach((s, idx) => {
            if (!logsByDate[s.date]) logsByDate[s.date] = [];
            logsByDate[s.date].push({ ...s, originalIndex: idx });
        });

        // Previous month filler days
        for (let i = firstDayIndex; i > 0; i--) {
            const dNum = prevTotalDays - i + 1;
            html += `<div class="cal-cell other-month"><span>${dNum}</span></div>`;
        }

        // Current month days
        for (let d = 1; d <= totalDays; d++) {
            const cellDate = new Date(year, month, d);
            const dateStr = cellDate.toLocaleDateString();
            const hasLogs = logsByDate[dateStr] && logsByDate[dateStr].length > 0;
            const isSelected = (dateStr === selectedCalendarDateStr);

            html += `
                <div class="cal-cell ${isSelected ? 'selected' : ''}" onclick="selectCalendarDate('${dateStr}')">
                    <span>${d}</span>
                    ${hasLogs ? '<div class="cal-dot"></div>' : ''}
                </div>
            `;
        }

        // Next month filler days
        const totalCellsRendered = firstDayIndex + totalDays;
        const remainingCells = (totalCellsRendered % 7 === 0) ? 0 : (7 - (totalCellsRendered % 7));
        for (let d = 1; d <= remainingCells; d++) {
            html += `<div class="cal-cell other-month"><span>${d}</span></div>`;
        }

        html += `</div><div id="calendar-day-logs-container"></div>`;
        container.innerHTML = html;
        renderCalendarDayLogs(logsByDate[selectedCalendarDateStr] || [], selectedCalendarDateStr);
    }

    function changeCalendarMonth(direction) {
        calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() + direction);
        renderCalendarView();
    }

    function selectCalendarDate(dateStr) {
        selectedCalendarDateStr = dateStr;
        renderCalendarView();
    }

    function renderCalendarDayLogs(daySessions, dateStr) {
        const container = document.getElementById('calendar-day-logs-container');
        if (!container) return;

        let html = `<div style="font-size: 0.85rem; font-weight: 600; color: var(--accent); margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px;">Logs for ${dateStr}</div>`;
        
        if (daySessions.length === 0) {
            html += `<p style="font-size: 0.8rem; color: var(--text-muted);">No brew logs recorded for this day.</p>`;
        } else {
            daySessions.forEach(s => {
                const headerTitle = s.roastery ? `${s.beanName} (${s.roastery})` : s.beanName;
                html += `
                    <div class="item-card">
                        <div class="history-score-badge" style="top: 12px; right: 12px; font-size: 0.95rem; padding: 4px 8px;">${s.score}</div>
                        <div class="item-card-header">
                            <strong>${headerTitle}</strong>
                        </div>
                        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2px;">Origin: ${s.origin || 'Unknown'} | Roast: ${s.roast}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Grind: ${s.grind} clicks | Temp: ${s.temp}°C | Ratio: ${s.coffee}g / ${s.water}g</div>
                        <div style="font-size: 0.8rem;">Notes: ${s.notes || 'None recorded'}</div>
                        <div class="card-actions">
                            <button onclick="deleteBrewSession(${s.originalIndex})" class="danger">Delete Log</button>
                        </div>
                    </div>
                `;
            });
        }
        container.innerHTML = html;
    }

    function deleteBrewSession(index) {
        if (!confirm("Are you sure you want to delete this brew log?")) return;
        db.sessions.splice(index, 1);
        persistData();
        renderHistoryContent();
    }

    function renderTasterProfile() {
        const countryCounts = {};
        const roastComboCounts = {};
        const noteCounts = {};

        db.sessions.forEach(s => {
            if (s.origin) countryCounts[s.origin] = (countryCounts[s.origin] || 0) + 1;

            if (s.roast && s.flavorType) {
                const combo = `${s.roast} + ${s.flavorType}`;
                roastComboCounts[combo] = (roastComboCounts[combo] || 0) + 1;
            }
        });

        db.beans.forEach(b => {
            if (b.origin && !Object.keys(countryCounts).length) countryCounts[b.origin] = (countryCounts[b.origin] || 0) + 1;
            if (b.roast && b.flavorType) {
                const combo = `${b.roast} + ${b.flavorType}`;
                roastComboCounts[combo] = (roastComboCounts[combo] || 0) + 1;
            }
            if (b.flavor) {
                b.flavor.split(',').forEach(n => {
                    const cleanNote = n.trim();
                    if (cleanNote) noteCounts[cleanNote] = (noteCounts[cleanNote] || 0) + 1;
                });
            }
        });

        const favCountry = Object.keys(countryCounts).length > 0 
            ? Object.keys(countryCounts).reduce((a, b) => countryCounts[a] > countryCounts[b] ? a : b) 
            : 'None Recorded';

        const favRoast = Object.keys(roastComboCounts).length > 0 
            ? Object.keys(roastComboCounts).reduce((a, b) => roastComboCounts[a] > roastComboCounts[b] ? a : b) 
            : 'None Recorded';

        const sortedNotes = Object.keys(noteCounts).sort((a, b) => noteCounts[b] - noteCounts[a]).slice(0, 3);

        document.getElementById('taster-profile-content').innerHTML = `
            <div class="profile-stat-box">
                <h3>Favourite Origin Country</h3>
                <p><strong>${favCountry}</strong></p>
            </div>
            <div class="profile-stat-box">
                <h3>Favourite Roast</h3>
                <p><strong>${favRoast}</strong></p>
            </div>
            <div class="profile-stat-box">
                <h3>Top 3 Ranked Tasting Notes</h3>
                <ol class="ranked-list">
                    ${sortedNotes.length > 0 ? sortedNotes.map(n => `<li><strong>${n}</strong></li>`).join('') : '<p style="font-size:0.8rem; color:var(--text-muted);">No bean tasting notes recorded yet.</p>'}
                </ol>
            </div>
        `;
    }

    updateBeanSelectDropdown();
</script>

</body>
</html>
