<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Pour-Over Master Tracker</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #2c2522;
            --text-muted: #786f6a;
            --accent: #8b5a2b;
            --accent-hover: #6f4520;
            --border-color: #e3ded5;
            --shadow: 0 4px 16px rgba(44, 37, 34, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 40px;
        }

        /* Navigation Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .step-panel {
            display: none;
        }

        .step-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            background: var(--border-color);
            cursor: not-allowed;
        }

        /* Timer UI */
        .timer-display-box {
            text-align: center;
            padding: 24px 0;
            background: #faf8f5;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        #timer-clock {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        #timer-stage-indicator {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
        }

        #timer-status-instruction {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Compound Multi-Colored Bar */
        .compound-bar-wrapper {
            margin: 20px 0;
        }

        .compound-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        #compound-bar-container {
            display: flex;
            height: 12px;
            width: 100%;
            background: var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            gap: 2px;
        }

        .bar-segment {
            height: 100%;
            transition: width 0.3s ease;
        }

        /* Cards & Grouping */
        .suggestion-card {
            background: #fff8f0;
            border-left: 4px solid var(--accent);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .item-card {
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            background: #fff;
        }

        .item-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .item-card-header strong {
            color: var(--accent);
            font-size: 0.95rem;
        }

        .badge {
            font-size: 0.7rem;
            background: #faf8f5;
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .card-actions button {
            margin-top: 0;
            padding: 6px 10px;
            font-size: 0.8rem;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .card-actions button:hover {
            background: var(--accent);
            color: white;
        }

        .card-actions button.danger {
            color: #b22222;
            border-color: #b22222;
        }

        .card-actions button.danger:hover {
            background: #b22222;
            color: white;
        }

        .group-header {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
            margin: 18px 0 8px 0;
            padding-bottom: 4px;
            border-bottom: 1px dashed var(--border-color);
        }

        /* Taster Profile Dashboard Stats */
        .profile-stat-box {
            background: #faf8f5;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
            font-size: 0.85rem;
        }

        .profile-stat-box h3 {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .ranked-list {
            padding-left: 18px;
            margin-top: 4px;
        }

        .ranked-list li {
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>Precision Pour-Over</h1>
        <div class="nav-links">
            <a id="nav-brew" onclick="attemptNav(1)" class="active">Brew</a>
            <a id="nav-beans" onclick="attemptNav(5)">Beans</a>
            <a id="nav-profile" onclick="attemptNav(6)">Profile</a>
            <a id="nav-history" onclick="attemptNav(4)">History</a>
        </div>
    </div>
    <div class="subtitle" id="top-subtitle">Log, Time, and Refine Your Brews</div>

    <!-- STEP 1: BREW PARAMETERS -->
    <div id="step-1" class="step-panel active">
        <div class="form-group">
            <label>Bean Selection</label>
            <select id="bean-select" onchange="checkBeanSelect()">
                <option value="" disabled selected>-- Select a Bean Profile --</option>
                <option value="new">+ Add New Bean Profile</option>
            </select>
        </div>

        <div id="new-bean-section" style="display: none; background: #faf8f5; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color);">
            <div class="form-group">
                <label>Bean Name (e.g. Ethiopia (Yirgacheffe))</label>
                <input type="text" id="bean-name" placeholder="e.g. Ethiopia (Yirgacheffe)">
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Roast Level</label>
                    <select id="bean-roast">
                        <option value="Light">Light</option>
                        <option value="Medium-Light">Medium-Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Medium-Dark">Medium-Dark</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Flavor Profile Tag</label>
                    <select id="bean-flavor-type">
                        <option value="Fruity">Fruity</option>
                        <option value="Nutty">Nutty</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 8px;">
                <label>Specific Tasting Notes (comma separated)</label>
                <input type="text" id="bean-flavor" placeholder="e.g. Peach, Chocolate, Vanilla">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Grind Setting (Clicks)</label>
                <input type="number" id="param-grind" value="21">
            </div>
            <div class="form-group">
                <label>Water Temp (°C)</label>
                <input type="number" id="param-temp" value="92">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Coffee Dose (g)</label>
                <input type="number" id="param-coffee" value="15">
            </div>
            <div class="form-group">
                <label>Water Weight (g)</label>
                <input type="number" id="param-water" value="250">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Use Bloom Phase?</label>
                <select id="param-bloom">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="form-group">
                <label>Number of Pours</label>
                <input type="number" id="param-pours" value="3">
            </div>
        </div>

        <button onclick="startTimerSetup()" id="proceed-brew-btn" disabled>Proceed to Stopwatch</button>
    </div>

    <!-- STEP 2: MANUAL CHECKPOINT STOPWATCH -->
    <div id="step-2" class="step-panel">
        <div class="timer-display-box">
            <div id="timer-clock">0:00</div>
            <div id="timer-stage-indicator">Stage: Ready</div>
            <div id="timer-status-instruction">Tap below to initiate sequence</div>
        </div>

        <div class="compound-bar-wrapper">
            <div class="compound-bar-label">
                <span>Phase Breakdown Distribution</span>
                <span id="total-logged-time">0s total</span>
            </div>
            <div id="compound-bar-container">
                <div class="bar-segment" style="width: 100%; background: var(--border-color); opacity: 0.4;"></div>
            </div>
        </div>

        <button id="timer-action-btn" onclick="handlePourOrFinishPress()">Start Bloom</button>
        <button onclick="attemptNav(1)" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: 8px;">Cancel / Edit Params</button>
    </div>

    <!-- STEP 3: RATING & OPTIMIZATION TIPS -->
    <div id="step-3" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Brew Complete Analysis & Tips</h2>
        
        <div id="analytics-suggestions-box"></div>

        <div class="form-group">
            <label>Overall Cup Score (1 - 10)</label>
            <input type="number" id="cup-score" min="1" max="10" value="8" step="0.1">
        </div>

        <div class="form-group">
            <label>Tasting Notes & Observations (comma separated)</label>
            <textarea id="cup-notes" rows="3" placeholder="Peach, floral, clean finish..."></textarea>
        </div>

        <button onclick="saveBrewSession()">Save & Return to Brew</button>
    </div>

    <!-- STEP 4: HISTORY -->
    <div id="step-4" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Logged Brew History</h2>
        <div id="history-list-container"></div>
        <button onclick="attemptNav(1)">Back to Brew</button>
    </div>

    <!-- STEP 5: BEAN MANAGER -->
    <div id="step-5" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Bean Inventory Manager</h2>
        
        <div style="background: #faf8f5; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color);">
            <div class="form-group" style="margin-bottom: 10px;">
                <label id="bean-form-title">Add New Bean Inventory</label>
                <input type="text" id="mgr-name" placeholder="Name (e.g. Ethiopia (Yirgacheffe))">
            </div>
            <div class="row" style="margin-bottom: 10px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Roast Level</label>
                    <select id="mgr-roast">
                        <option value="Light">Light</option>
                        <option value="Medium-Light">Medium-Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Medium-Dark">Medium-Dark</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Flavor Profile Tag</label>
                    <select id="mgr-flavor-type">
                        <option value="Fruity">Fruity</option>
                        <option value="Nutty">Nutty</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 8px;">
                <label>Specific Tasting Notes</label>
                <input type="text" id="mgr-flavor" placeholder="e.g. Peach, Chocolate">
            </div>
            <input type="hidden" id="mgr-edit-id" value="">
            <button onclick="saveBeanFromManager()" id="mgr-save-btn" style="margin-top: 10px;">Save Bean Profile</button>
            <button id="mgr-cancel-btn" onclick="resetBeanManagerForm()" style="display:none; background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: 6px;">Cancel Edit</button>
        </div>

        <div id="bean-manager-list"></div>
        <button onclick="attemptNav(1)" style="margin-top: 16px;">Back to Brew</button>
    </div>

    <!-- STEP 6: COFFEE TASTER PROFILE DASHBOARD -->
    <div id="step-6" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Coffee Taster Profile & Preferences</h2>
        <div id="taster-profile-content"></div>
        <button onclick="attemptNav(1)" style="margin-top: 16px;">Back to Brew</button>
    </div>
</div>

<script>
    const db = {
        beans: JSON.parse(localStorage.getItem('pour_over_beans')) || [],
        sessions: JSON.parse(localStorage.getItem('pour_over_sessions')) || []
    };

    function persistData() {
        localStorage.setItem('pour_over_beans', JSON.stringify(db.beans));
        localStorage.setItem('pour_over_sessions', JSON.stringify(db.sessions));
    }

    let activeBrew = {};
    let brewPhases = [];
    let currentPhaseIndex = 0;
    let currentPhaseSeconds = 0;
    let stopwatchSeconds = 0;
    let stopwatchInterval = null;
    let isStopwatchRunning = false;
    let currentStep = 1;

    const phaseColors = ['#8b5a2b', '#c29b61', '#d4b58a', '#e8d5b5', '#6f4520', '#a37042', '#b88654'];

    const knownCountries = [
        "ethiopia", "colombia", "columbia", "kenya", "guatemala", "costa rica", 
        "panama", "brazil", "rwanda", "honduras", "peru", "sumatra", "yemen", 
        "mexico", "burundi", "el salvador", "vietnam", "indonesia", "tanzania", "colombia"
    ];

    function getCountryFromBeanName(nameStr) {
        if (!nameStr) return "Unknown Origin";
        
        // 1. Check inside parentheses first (e.g., "Elysian Coffee (Ethiopia)" or "Ethiopia (Yirgacheffe)")
        const match = nameStr.match(/\(([^)]+)\)/);
        if (match) {
            const content = match[1].trim();
            const lowerContent = content.toLowerCase();
            for (let c of knownCountries) {
                if (lowerContent.includes(c)) return c.charAt(0).toUpperCase() + c.slice(1);
            }
            // If the text inside parentheses isn't a known country match, use it if it looks like a location/region
            if (content.length > 2) return content;
        }
        
        // 2. Check whole string for any known country
        const lowerName = nameStr.toLowerCase();
        for (let c of knownCountries) {
            if (lowerName.includes(c)) return c.charAt(0).toUpperCase() + c.slice(1);
        }

        // 3. Fallback: if no match found anywhere, return the string cleanly or Unknown Origin
        return nameStr.split('(')[0].trim() || "Unknown Origin";
    }

    window.addEventListener('beforeunload', (e) => {
        if (isStopwatchRunning || currentStep === 2) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    function attemptNav(stepNum) {
        if (currentStep === 2 && stepNum !== 2) {
            if (!confirm("Are you sure you want to leave? Active timer will be lost.")) return;
            if (stopwatchInterval) clearInterval(stopwatchInterval);
            isStopwatchRunning = false;
        }
        goToStep(stepNum);
    }

    function goToStep(stepNum) {
        currentStep = stepNum;
        document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`step-${stepNum}`).classList.add('active');

        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        if (stepNum === 1 || stepNum === 2 || stepNum === 3) document.getElementById('nav-brew').classList.add('active');
        if (stepNum === 5) document.getElementById('nav-beans').classList.add('active');
        if (stepNum === 6) document.getElementById('nav-profile').classList.add('active');
        if (stepNum === 4) document.getElementById('nav-history').classList.add('active');

        if (stepNum === 1) updateBeanSelectDropdown();
        if (stepNum === 2) initStopwatchSession();
        if (stepNum === 4) renderHistoryList();
        if (stepNum === 5) renderBeanManager();
        if (stepNum === 6) renderTasterProfile();
    }

    function updateBeanSelectDropdown(selectedName = "") {
        const select = document.getElementById('bean-select');
        select.innerHTML = '<option value="" disabled selected>-- Select a Bean Profile --</option>';
        db.beans.filter(b => !b.archived).forEach((b) => {
            const opt = document.createElement('option');
            opt.value = b.id;
            opt.textContent = `${b.name} (${b.roast})`;
            select.appendChild(opt);
        });
        select.innerHTML += '<option value="new">+ Add New Bean Profile</option>';
        checkBeanSelect();
    }

    function checkBeanSelect() {
        const val = document.getElementById('bean-select').value;
        document.getElementById('new-bean-section').style.display = (val === 'new') ? 'block' : 'none';
        document.getElementById('proceed-brew-btn').disabled = (val === '');
    }

    function startTimerSetup() {
        if (document.getElementById('bean-select').value === '') return;
        goToStep(2);
    }

    function renderBeanManager() {
        const container = document.getElementById('bean-manager-list');
        container.innerHTML = db.beans.length === 0 ? '<p style="font-size: 0.85rem; color: var(--text-muted);">No beans added.</p>' : '';
        db.beans.forEach((b) => {
            container.innerHTML += `
                <div class="item-card" style="${b.archived ? 'opacity:0.6' : ''}">
                    <div class="item-card-header"><strong>${b.name}</strong><span class="badge">${b.roast}</span></div>
                    <div class="card-actions">
                        <button onclick="editBean('${b.id}')">Edit</button>
                        <button onclick="toggleArchiveBean('${b.id}')" class="danger">${b.archived ? 'Unarchive' : 'Archive'}</button>
                    </div>
                </div>
            `;
        });
    }

    function saveBeanFromManager() {
        const name = document.getElementById('mgr-name').value.trim();
        const roast = document.getElementById('mgr-roast').value;
        const flavorType = document.getElementById('mgr-flavor-type').value;
        const flavor = document.getElementById('mgr-flavor').value.trim();
        const editId = document.getElementById('mgr-edit-id').value;

        if (!name) return alert('Name required.');
        if (!editId) {
            db.beans.push({ id: 'b_' + Date.now(), name, roast, flavorType, flavor, archived: false });
        } else {
            const b = db.beans.find(x => x.id === editId);
            Object.assign(b, { name, roast, flavorType, flavor });
        }
        persistData();
        resetBeanManagerForm();
        renderBeanManager();
    }

    function editBean(id) {
        const b = db.beans.find(x => x.id === id);
        document.getElementById('mgr-name').value = b.name;
        document.getElementById('mgr-roast').value = b.roast;
        document.getElementById('mgr-edit-id').value = id;
        document.getElementById('mgr-save-btn').textContent = 'Update';
        document.getElementById('mgr-cancel-btn').style.display = 'block';
    }

    function resetBeanManagerForm() {
        document.getElementById('mgr-name').value = '';
        document.getElementById('mgr-edit-id').value = '';
        document.getElementById('mgr-save-btn').textContent = 'Save Bean Profile';
        document.getElementById('mgr-cancel-btn').style.display = 'none';
    }

    function toggleArchiveBean(id) {
        const b = db.beans.find(x => x.id === id);
        b.archived = !b.archived;
        persistData();
        renderBeanManager();
    }

    function initStopwatchSession() {
        const val = document.getElementById('bean-select').value;
        if (val === 'new') {
            const name = document.getElementById('bean-name').value.trim() || 'Kenya Nyeri';
            db.beans.push({ id: 'b_' + Date.now(), name, roast: document.getElementById('bean-roast').value, flavorType: document.getElementById('bean-flavor-type').value, flavor: document.getElementById('bean-flavor').value, archived: false });
            activeBrew.beanName = name;
        } else {
            activeBrew.beanName = db.beans.find(x => x.id === val).name;
        }
        activeBrew.grind = document.getElementById('param-grind').value;
        activeBrew.temp = document.getElementById('param-temp').value;
        activeBrew.coffee = document.getElementById('param-coffee').value;
        activeBrew.water = document.getElementById('param-water').value;
        activeBrew.bloom = document.getElementById('param-bloom').value;
        activeBrew.pours = document.getElementById('param-pours').value;
        
        brewPhases = [{name: 'Bloom', duration: 0, color: '#8b5a2b'}];
        for(let i=0; i<parseInt(activeBrew.pours); i++) brewPhases.push({name: 'Pour '+ (i+1), duration: 0, color: '#c29b61'});
        brewPhases.push({name: 'Drawdown', duration: 0, color: '#d4b58a'});

        currentPhaseIndex = 0; currentPhaseSeconds = 0; stopwatchSeconds = 0; isStopwatchRunning = false;
    }

    function handlePourOrFinishPress() {
        if (!isStopwatchRunning) {
            isStopwatchRunning = true;
            stopwatchInterval = setInterval(() => {
                stopwatchSeconds++;
                currentPhaseSeconds++;
                document.getElementById('timer-clock').textContent = Math.floor(stopwatchSeconds/60) + ':' + (stopwatchSeconds%60).toString().padStart(2,'0');
            }, 1000);
            document.getElementById('timer-action-btn').textContent = 'Next Stage';
        } else if (currentPhaseIndex < brewPhases.length - 1) {
            brewPhases[currentPhaseIndex].duration = currentPhaseSeconds;
            currentPhaseSeconds = 0;
            currentPhaseIndex++;
            document.getElementById('timer-stage-indicator').textContent = 'Stage: ' + brewPhases[currentPhaseIndex].name;
        } else {
            clearInterval(stopwatchInterval);
            isStopwatchRunning = false;
            goToStep(3);
        }
    }

    function saveBrewSession() {
        activeBrew.score = parseFloat(document.getElementById('cup-score').value);
        activeBrew.notes = document.getElementById('cup-notes').value;
        activeBrew.date = new Date().toLocaleDateString();
        db.sessions.unshift(activeBrew);
        persistData();
        goToStep(1);
    }

    function renderHistoryList() {
        const container = document.getElementById('history-list-container');
        container.innerHTML = db.sessions.map(s => `<div class="item-card"><strong>${s.beanName}</strong><br>Score: ${s.score}/10 | ${s.date}</div>`).join('');
    }

    function renderTasterProfile() {
        const noteCounts = {};
        const countryCounts = {};
        const stopWords = new Set(["good", "light", "refreshing", "clean", "nice", "sweet", "bitter"]);

        db.sessions.forEach(s => {
            const country = getCountryFromBeanName(s.beanName);
            countryCounts[country] = (countryCounts[country] || 0) + 1;

            (s.notes || '').split(',').forEach(n => {
                const note = n.trim().toLowerCase();
                if (note && !stopWords.has(note)) noteCounts[note] = (noteCounts[note] || 0) + 1;
            });
        });

        const topCountry = Object.keys(countryCounts).length > 0 
            ? Object.keys(countryCounts).reduce((a, b) => countryCounts[a] > countryCounts[b] ? a : b) 
            : 'None Recorded';

        const sortedNotes = Object.keys(noteCounts).sort((a, b) => noteCounts[b] - noteCounts[a]).slice(0, 3);

        document.getElementById('taster-profile-content').innerHTML = `
            <div class="profile-stat-box">
                <h3>🌍 Favorite Origin Country</h3>
                <p><strong>${topCountry}</strong></p>
            </div>
            <div class="profile-stat-box">
                <h3>🏆 Top 3 Ranked Tasting Notes</h3>
                <ol class="ranked-list">
                    ${sortedNotes.length > 0 ? sortedNotes.map(n => `<li><strong>${n}</strong></li>`).join('') : '<p style="font-size:0.8rem; color:var(--text-muted);">No specific tasting notes recorded yet.</p>'}
                </ol>
            </div>
        `;
    }

    updateBeanSelectDropdown();
</script>

</body>
</html>
