<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Pour-Over Master Tracker</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #2c2522;
            --text-muted: #786f6a;
            --accent: #8b5a2b;
            --accent-hover: #6f4520;
            --border-color: #e3ded5;
            --shadow: 0 4px 16px rgba(44, 37, 34, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 40px;
        }

        /* Navigation Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 10px;
            font-size: 0.8rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .step-panel {
            display: none;
        }

        .step-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            background: var(--border-color);
            cursor: not-allowed;
        }

        /* Timer UI */
        .timer-display-box {
            text-align: center;
            padding: 24px 0;
            background: #faf8f5;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        #timer-clock {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        #timer-stage-indicator {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
        }

        #timer-status-instruction {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Compound Multi-Colored Bar */
        .compound-bar-wrapper {
            margin: 20px 0;
        }

        .compound-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        #compound-bar-container {
            display: flex;
            height: 12px;
            width: 100%;
            background: var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            gap: 2px;
        }

        .bar-segment {
            height: 100%;
            transition: width 0.3s ease;
        }

        /* Cards & Grouping */
        .suggestion-card {
            background: #fff8f0;
            border-left: 4px solid var(--accent);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .item-card {
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            background: #fff;
        }

        .item-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .item-card-header strong {
            color: var(--accent);
            font-size: 0.95rem;
        }

        .badge {
            font-size: 0.7rem;
            background: #faf8f5;
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .card-actions button {
            margin-top: 0;
            padding: 6px 10px;
            font-size: 0.8rem;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .card-actions button:hover {
            background: var(--accent);
            color: white;
        }

        .card-actions button.danger {
            color: #b22222;
            border-color: #b22222;
        }

        .card-actions button.danger:hover {
            background: #b22222;
            color: white;
        }

        .group-header {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
            margin: 16px 0 8px 0;
            padding-bottom: 4px;
            border-bottom: 1px dashed var(--border-color);
        }

        /* Taster Profile Dashboard Stats */
        .profile-stat-box {
            background: #faf8f5;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
            font-size: 0.85rem;
        }

        .profile-stat-box h3 {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .ranked-list {
            padding-left: 18px;
            margin-top: 4px;
        }

        .ranked-list li {
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1 id="main-title">Precision Pour-Over</h1>
        <div class="nav-links">
            <a id="nav-brew" onclick="goToStep(1)" class="active">Brew</a>
            <a id="nav-beans" onclick="renderBeanManager(); goToStep(5);">Beans</a>
            <a id="nav-profile" onclick="renderTasterProfile(); goToStep(6);">Profile</a>
            <a id="nav-history" onclick="renderHistoryList(); goToStep(4);">History</a>
        </div>
    </div>
    <div class="subtitle" id="top-subtitle">Log, Time, and Refine Your Brews</div>

    <!-- STEP 1: BREW PARAMETERS -->
    <div id="step-1" class="step-panel active">
        <div class="form-group">
            <label>Bean Selection</label>
            <select id="bean-select" onchange="checkBeanSelect()">
                <option value="" disabled selected>-- Select a Bean Profile --</option>
                <option value="new">+ Add New Bean Profile</option>
            </select>
        </div>

        <div id="new-bean-section" style="display: none; background: #faf8f5; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color);">
            <div class="form-group">
                <label>Bean Name & Origin Country</label>
                <input type="text" id="bean-name" placeholder="e.g. Kenya Nyeri Hill (Kenya)">
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Roast Level</label>
                    <select id="bean-roast">
                        <option value="Light">Light</option>
                        <option value="Medium-Light">Medium-Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Medium-Dark">Medium-Dark</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Flavor Profile Tag</label>
                    <select id="bean-flavor-type">
                        <option value="Fruity">Fruity</option>
                        <option value="Nutty">Nutty</option>
                        <option value="Floral">Floral</option>
                        <option value="Chocolatey">Chocolatey</option>
                        <option value="Spicy">Spicy</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 8px;">
                <label>Specific Tasting Notes</label>
                <input type="text" id="bean-flavor" placeholder="e.g. Jasmine, Peach, Blackcurrant">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Grind Setting (Clicks)</label>
                <input type="number" id="param-grind" value="21">
            </div>
            <div class="form-group">
                <label>Water Temp (°C)</label>
                <input type="number" id="param-temp" value="92">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Coffee Dose (g)</label>
                <input type="number" id="param-coffee" value="15">
            </div>
            <div class="form-group">
                <label>Water Weight (g)</label>
                <input type="number" id="param-water" value="250">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Use Bloom Phase?</label>
                <select id="param-bloom">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="form-group">
                <label>Number of Pours</label>
                <input type="number" id="param-pours" value="3">
            </div>
        </div>

        <button onclick="startTimerSetup()" id="proceed-brew-btn" disabled>Proceed to Stopwatch</button>
    </div>

    <!-- STEP 2: MANUAL CHECKPOINT STOPWATCH -->
    <div id="step-2" class="step-panel">
        <div class="timer-display-box">
            <div id="timer-clock">0:00</div>
            <div id="timer-stage-indicator">Stage: Ready</div>
            <div id="timer-status-instruction">Tap below to initiate sequence</div>
        </div>

        <div class="compound-bar-wrapper">
            <div class="compound-bar-label">
                <span>Phase Breakdown Distribution</span>
                <span id="total-logged-time">0s total</span>
            </div>
            <div id="compound-bar-container">
                <div class="bar-segment" style="width: 100%; background: var(--border-color); opacity: 0.4;"></div>
            </div>
        </div>

        <button id="timer-action-btn" onclick="handlePourOrFinishPress()">Start Bloom</button>
        <button onclick="goToStep(1)" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: 8px;">Cancel / Edit Params</button>
    </div>

    <!-- STEP 3: RATING & ANALYTICS -->
    <div id="step-3" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Brew Complete Analysis</h2>
        
        <div id="analytics-suggestions-box"></div>

        <div class="form-group">
            <label>Overall Cup Score (1 - 10)</label>
            <input type="number" id="cup-score" min="1" max="10" value="8">
        </div>

        <div class="form-group">
            <label>Tasting Notes & Observations</label>
            <textarea id="cup-notes" rows="3" placeholder="Balanced acidity, clean finish, slight bitterness on tail end..."></textarea>
        </div>

        <button onclick="saveBrewSession()">Save & View History</button>
    </div>

    <!-- STEP 4: HISTORY -->
    <div id="step-4" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Logged Brew History</h2>
        <div id="history-list-container"></div>
        <button onclick="goToStep(1)">Brew Another Cup</button>
    </div>

    <!-- STEP 5: BEAN MANAGER (GROUPED & SORTED) -->
    <div id="step-5" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Bean Inventory Manager</h2>
        
        <div style="background: #faf8f5; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color);">
            <div class="form-group" style="margin-bottom: 10px;">
                <label id="bean-form-title">Add New Bean Inventory</label>
                <input type="text" id="mgr-name" placeholder="Bean Name & Origin Country">
            </div>
            <div class="row" style="margin-bottom: 10px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Roast Level</label>
                    <select id="mgr-roast">
                        <option value="Light">Light</option>
                        <option value="Medium-Light">Medium-Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Medium-Dark">Medium-Dark</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Flavor Profile Tag</label>
                    <select id="mgr-flavor-type">
                        <option value="Fruity">Fruity</option>
                        <option value="Nutty">Nutty</option>
                        <option value="Floral">Floral</option>
                        <option value="Chocolatey">Chocolatey</option>
                        <option value="Spicy">Spicy</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 8px;">
                <label>Specific Tasting Notes</label>
                <input type="text" id="mgr-flavor" placeholder="e.g. Jasmine, Peach, Blackcurrant">
            </div>
            <input type="hidden" id="mgr-edit-index" value="-1">
            <button onclick="saveBeanFromManager()" id="mgr-save-btn" style="margin-top: 10px;">Save Bean Profile</button>
            <button id="mgr-cancel-btn" onclick="resetBeanManagerForm()" style="display:none; background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: 6px;">Cancel Edit</button>
        </div>

        <div id="bean-manager-list"></div>
        <button onclick="goToStep(1)" style="margin-top: 16px;">Back to Brew Setup</button>
    </div>

    <!-- STEP 6: COFFEE TASTER PROFILE DASHBOARD -->
    <div id="step-6" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Coffee Taster Profile & Preferences</h2>
        <div id="taster-profile-content"></div>
        <button onclick="goToStep(1)" style="margin-top: 16px;">Back to Brew Setup</button>
    </div>
</div>

<script>
    const db = {
        beans: [],
        sessions: []
    };

    let activeBrew = {};
    let brewPhases = [];
    let currentPhaseIndex = 0;
    let currentPhaseSeconds = 0;
    let stopwatchSeconds = 0;
    let stopwatchInterval = null;
    let isStopwatchRunning = false;

    const phaseColors = ['#8b5a2b', '#c29b61', '#d4b58a', '#e8d5b5', '#6f4520', '#a37042', '#b88654'];

    function goToStep(stepNum) {
        document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`step-${stepNum}`).classList.add('active');

        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        if (stepNum === 1 || stepNum === 2 || stepNum === 3) document.getElementById('nav-brew').classList.add('active');
        if (stepNum === 4) document.getElementById('nav-history').classList.add('active');
        if (stepNum === 5) document.getElementById('nav-beans').classList.add('active');
        if (stepNum === 6) document.getElementById('nav-profile').classList.add('active');

        const subtitles = {
            1: "Log, Time, and Refine Your Brews",
            2: "Manual Checkpoint Stopwatch Mode",
            3: "Performance Insights & Cup Scoring",
            4: "Archived Logs & Optimization Progress",
            5: "Organize, Edit, and Archive Your Bean Stash",
            6: "Your Analytical Taster Dashboard & Ranked Preferences"
        };
        document.getElementById('top-subtitle').textContent = subtitles[stepNum];

        if (stepNum === 1) updateBeanSelectDropdown();
        if (stepNum === 2) initStopwatchSession();
        if (stepNum === 5) renderBeanManager();
        if (stepNum === 6) renderTasterProfile();
    }

    function updateBeanSelectDropdown(selectedName = "") {
        const select = document.getElementById('bean-select');
        select.innerHTML = '<option value="" disabled selected>-- Select a Bean Profile --</option>';

        const activeBeans = db.beans.filter(b => !b.archived);
        activeBeans.forEach((b, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `${b.name} (${b.roast} - ${b.flavorType || 'Fruity'})`;
            if (b.name === selectedName) opt.selected = true;
            select.appendChild(opt);
        });

        const newOpt = document.createElement('option');
        newOpt.value = 'new';
        newOpt.textContent = '+ Add New Bean Profile';
        select.appendChild(newOpt);

        checkBeanSelect();
    }

    function checkBeanSelect() {
        const val = document.getElementById('bean-select').value;
        const newSec = document.getElementById('new-bean-section');
        const btn = document.getElementById('proceed-brew-btn');

        if (val === 'new') {
            newSec.style.display = 'block';
            btn.disabled = false;
        } else if (val === '') {
            newSec.style.display = 'none';
            btn.disabled = true;
        } else {
            newSec.style.display = 'none';
            btn.disabled = false;
        }
    }

    function startTimerSetup() {
        const val = document.getElementById('bean-select').value;
        if (val === '') return;
        goToStep(2);
    }

    // Helper to calculate average ranking score for a bean based on past sessions
    function getBeanAverageScore(beanName) {
        const matchingSessions = db.sessions.filter(s => s.beanName === beanName);
        if (matchingSessions.length === 0) return 0;
        const sum = matchingSessions.reduce((acc, s) => acc + parseFloat(s.score || 0), 0);
        return sum / matchingSessions.length;
    }

    // Bean Manager Grouped by Type and Sorted by Average Ranking Score
    function renderBeanManager() {
        const container = document.getElementById('bean-manager-list');
        if (db.beans.length === 0) {
            container.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom:16px;">No beans added yet. Use the form above to add your first bag.</p>';
            return;
        }

        // Group beans by flavor type / category
        const groups = {};
        db.beans.forEach((b, idx) => {
            const type = b.flavorType || 'Fruity';
            if (!groups[type]) groups[type] = [];
            groups[type].push({ ...b, originalIndex: idx });
        });

        // Within each group, sort beans by average ranking score descending
        Object.keys(groups).forEach(type => {
            groups[type].sort((a, b) => getBeanAverageScore(b.name) - getBeanAverageScore(a.name));
        });

        let html = '';
        Object.keys(groups).forEach(type => {
            html += `<div class="group-header">${type} Beans</div>`;
            groups[type].forEach(b => {
                const avgScore = getBeanAverageScore(b.name);
                html += `
                    <div class="item-card" style="${b.archived ? 'opacity: 0.6; background: #faf8f5;' : ''}">
                        <div class="item-card-header">
                            <strong>${b.name}</strong>
                            <span class="badge">${b.roast} | Avg: ${avgScore > 0 ? avgScore.toFixed(1) : 'N/A'}/10 ${b.archived ? '(Archived)' : ''}</span>
                        </div>
                        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px;">
                            Notes: ${b.flavor || 'None specified'}
                        </div>
                        <div class="card-actions">
                            <button onclick="editBean(${b.originalIndex})">Edit</button>
                            <button onclick="toggleArchiveBean(${b.originalIndex})" class="danger">${b.archived ? 'Unarchive' : 'Archive'}</button>
                        </div>
                    </div>
                `;
            });
        });

        container.innerHTML = html;
    }

    function saveBeanFromManager() {
        const name = document.getElementById('mgr-name').value.trim();
        const roast = document.getElementById('mgr-roast').value;
        const flavorType = document.getElementById('mgr-flavor-type').value;
        const flavor = document.getElementById('mgr-flavor').value.trim();
        const editIdx = parseInt(document.getElementById('mgr-edit-index').value);

        if (!name) {
            alert('Please enter a bean name and origin.');
            return;
        }

        if (editIdx === -1) {
            db.beans.push({ name, roast, flavorType, flavor, archived: false });
        } else {
            db.beans[editIdx].name = name;
            db.beans[editIdx].roast = roast;
            db.beans[editIdx].flavorType = flavorType;
            db.beans[editIdx].flavor = flavor;
        }

        resetBeanManagerForm();
        renderBeanManager();
    }

    function editBean(idx) {
        const b = db.beans[idx];
        document.getElementById('mgr-name').value = b.name;
        document.getElementById('mgr-roast').value = b.roast;
        document.getElementById('mgr-flavor-type').value = b.flavorType || 'Fruity';
        document.getElementById('mgr-flavor').value = b.flavor || '';
        document.getElementById('mgr-edit-index').value = idx;
        document.getElementById('bean-form-title').textContent = 'Edit Bean Profile';
        document.getElementById('mgr-save-btn').textContent = 'Update Bean Profile';
        document.getElementById('mgr-cancel-btn').style.display = 'block';
    }

    function resetBeanManagerForm() {
        document.getElementById('mgr-name').value = '';
        document.getElementById('mgr-flavor').value = '';
        document.getElementById('mgr-edit-index').value = -1;
        document.getElementById('bean-form-title').textContent = 'Add New Bean Inventory';
        document.getElementById('mgr-save-btn').textContent = 'Save Bean Profile';
        document.getElementById('mgr-cancel-btn').style.display = 'none';
    }

    function toggleArchiveBean(idx) {
        db.beans[idx].archived = !db.beans[idx].archived;
        renderBeanManager();
    }

    // Coffee Taster Profile Dashboard Analytics
    function renderTasterProfile() {
        const container = document.getElementById('taster-profile-content');
        if (db.sessions.length === 0) {
            container.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted);">No completed brews recorded yet. Log some cups with scores to generate your analytical taster profile!</p>';
            return;
        }

        // Aggregate stats from sessions & associated beans
        const roastCounts = {};
        const countryCounts = {};
        const noteCounts = {};

        db.sessions.forEach(s => {
            const matchingBean = db.beans.find(b => b.name === s.beanName) || {};
            const roast = matchingBean.roast || 'Light';
            roastCounts[roast] = (roastCounts[roast] || 0) + 1;

            // Extract country name inside parentheses if provided (e.g. "Kenya Nyeri Hill (Kenya)")
            const nameStr = s.beanName || '';
            const match = nameStr.match(/\(([^)]+)\)/);
            const country = match ? match[1].trim() : 'Global Blend / Unspecified';
            countryCounts[country] = (countryCounts[country] || 0) + 1;

            // Process tasting notes separated by commas
            if (s.notes) {
                s.notes.split(',').forEach(n => {
                    const cleanNote = n.trim().toLowerCase();
                    if (cleanNote) {
                        noteCounts[cleanNote] = (noteCounts[cleanNote] || 0) + 1;
                    }
                });
            }
        });

        // Determine favorites
        const favRoast = Object.keys(roastCounts).reduce((a, b) => roastCounts[a] > roastCounts[b] ? a : b, 'None');
        const favCountry = Object.keys(countryCounts).reduce((a, b) => countryCounts[a] > countryCounts[b] ? a : b, 'None');

        // Rank top 3 tasting notes
        const sortedNotes = Object.keys(noteCounts).sort((a, b) => noteCounts[b] - noteCounts[a]);
        const top3Notes = sortedNotes.slice(0, 3);

        container.innerHTML = `
            <div class="profile-stat-box">
                <h3>☕ Favorite Roast Style</h3>
                <p><strong>${favRoast}</strong> (Logged across your top sessions)</p>
            </div>
            <div class="profile-stat-box">
                <h3>🌍 Favorite Origin Country</h3>
                <p><strong>${favCountry}</strong></p>
            </div>
            <div class="profile-stat-box">
                <h3>🏆 Top 3 Ranked Tasting Notes</h3>
                ${top3Notes.length > 0 ? `
                    <ol class="ranked-list">
                        ${top3Notes.map(n => `<li><strong>${n.charAt(0).toUpperCase() + n.slice(1)}</strong> (${noteCounts[n]} occurrences)</li>`).join('')}
                    </ol>
                ` : '<p style="font-size:0.8rem; color:var(--text-muted);">No specific comma tasting notes recorded yet.</p>'}
            </div>
        `;
    }

    // Stopwatch & Brew Logic
    function initStopwatchSession() {
        const beanVal = document.getElementById('bean-select').value;
        if (beanVal === 'new') {
            const name = document.getElementById('bean-name').value.trim() || 'Custom Bean';
            const roast = document.getElementById('bean-roast').value;
            const flavorType = document.getElementById('bean-flavor-type').value;
            const flavor = document.getElementById('bean-flavor').value.trim();
            
            db.beans.push({ name, roast, flavorType, flavor, archived: false });
            activeBrew.beanName = name;
            activeBrew.roast = roast;
            activeBrew.flavor = flavor;
        } else {
            const activeBeansList = db.beans.filter(b => !b.archived);
            const b = activeBeansList[beanVal];
            activeBrew.beanName = b.name;
            activeBrew.roast = b.roast;
            activeBrew.flavor = b.flavor;
        }

        activeBrew.grind = parseFloat(document.getElementById('param-grind').value) || 21;
        activeBrew.temp = parseFloat(document.getElementById('param-temp').value) || 92;
        activeBrew.coffee = parseFloat(document.getElementById('param-coffee').value) || 15;
        activeBrew.water = parseFloat(document.getElementById('param-water').value) || 250;
        activeBrew.bloom = document.getElementById('param-bloom').value;
        activeBrew.pours = parseInt(document.getElementById('param-pours').value) || 3;

        brewPhases = [];
        let colorIdx = 0;

        if (activeBrew.bloom === 'Yes') {
            brewPhases.push({ name: 'Bloom', duration: 0, color: phaseColors[colorIdx++ % phaseColors.length] });
            brewPhases.push({ name: 'Bloom Pause', duration: 0, color: phaseColors[colorIdx++ % phaseColors.length] });
        }

        for (let i = 1; i <= activeBrew.pours; i++) {
            brewPhases.push({ name: `Pour ${i}`, duration: 0, color: phaseColors[colorIdx++ % phaseColors.length] });
            if (i < activeBrew.pours) {
                brewPhases.push({ name: `Pause ${i}`, duration: 0, color: phaseColors[colorIdx++ % phaseColors.length] });
            }
        }

        brewPhases.push({ name: 'Final Drawdown', duration: 0, color: phaseColors[colorIdx++ % phaseColors.length] });

        currentPhaseIndex = 0;
        currentPhaseSeconds = 0;
        stopwatchSeconds = 0;
        isStopwatchRunning = false;
        if (stopwatchInterval) clearInterval(stopwatchInterval);

        const actionBtn = document.getElementById('timer-action-btn');
        actionBtn.style.width = '100%';
        actionBtn.disabled = false;
        actionBtn.textContent = `Start ${brewPhases[0].name}`;
        
        document.getElementById('timer-stage-indicator').textContent = 'Stage: Ready';
        document.getElementById('timer-status-instruction').textContent = `Tap to start ${brewPhases[0].name}`;

        updateCompoundBarUI();
    }

    function handlePourOrFinishPress() {
        if (!isStopwatchRunning) {
            isStopwatchRunning = true;
            if (stopwatchInterval) clearInterval(stopwatchInterval);
            
            stopwatchInterval = setInterval(() => {
                stopwatchSeconds++;
                currentPhaseSeconds++;
                if (brewPhases[currentPhaseIndex]) {
                    brewPhases[currentPhaseIndex].duration = currentPhaseSeconds;
                }
                updateCompoundBarUI();
            }, 1000);

            currentPhaseIndex++;
            if (currentPhaseIndex < brewPhases.length) {
                document.getElementById('timer-action-btn').textContent = `Start ${brewPhases[currentPhaseIndex].name}`;
                document.getElementById('timer-status-instruction').textContent = `Active: ${brewPhases[currentPhaseIndex - 1].name} in progress...`;
            } else {
                document.getElementById('timer-action-btn').textContent = `Complete Brew`;
            }
            updateCompoundBarUI();
            return;
        }

        if (currentPhaseIndex < brewPhases.length) {
            brewPhases[currentPhaseIndex - 1].duration = currentPhaseSeconds;
            currentPhaseSeconds = 0;
            
            const activePhase = brewPhases[currentPhaseIndex];
            document.getElementById('timer-status-instruction').textContent = `Active: ${activePhase.name} in progress...`;

            currentPhaseIndex++;
            if (currentPhaseIndex < brewPhases.length) {
                document.getElementById('timer-action-btn').textContent = `Start ${brewPhases[currentPhaseIndex].name}`;
            } else {
                document.getElementById('timer-action-btn').textContent = `Complete Brew`;
            }
        } else {
            if (stopwatchInterval) clearInterval(stopwatchInterval);
            isStopwatchRunning = false;
            brewPhases[brewPhases.length - 1].duration = currentPhaseSeconds;
            
            generateAnalyticsSuggestions();
            goToStep(3);
        }
        updateCompoundBarUI();
    }

    function updateCompoundBarUI() {
        const mins = Math.floor(stopwatchSeconds / 60);
        const secs = stopwatchSeconds % 60;
        document.getElementById('timer-clock').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        document.getElementById('total-logged-time').textContent = `${stopwatchSeconds}s total`;

        if (isStopwatchRunning && currentPhaseIndex > 0 && currentPhaseIndex <= brewPhases.length) {
            const activeName = brewPhases[currentPhaseIndex - 1].name;
            document.getElementById('timer-stage-indicator').textContent = `${activeName}: ${currentPhaseSeconds}s`;
        } else if (!isStopwatchRunning && stopwatchSeconds === 0) {
            document.getElementById('timer-stage-indicator').textContent = `Stage: Ready`;
        }

        const container = document.getElementById('compound-bar-container');
        const totalDuration = Math.max(stopwatchSeconds, 1);

        let html = '';
        brewPhases.forEach((phase, idx) => {
            const dur = phase.duration || (isStopwatchRunning && idx === currentPhaseIndex - 1 ? currentPhaseSeconds : 0);
            if (dur > 0) {
                const pct = Math.max((dur / totalDuration) * 100, 3);
                html += `<div class="bar-segment" style="width: ${pct}%; background: ${phase.color};" title="${phase.name}: ${dur}s"></div>`;
            }
        });

        if (!html) {
            html = `<div class="bar-segment" style="width: 100%; background: var(--border-color); opacity: 0.4;"></div>`;
        }
        container.innerHTML = html;
    }

    function generateAnalyticsSuggestions() {
        let suggestionsHTML = '';
        const bloomPhase = brewPhases.find(p => p.name === 'Bloom');
        const bloomDur = bloomPhase ? bloomPhase.duration : 0;
        const drawdownPhase = brewPhases.find(p => p.name === 'Final Drawdown');
        const drawdownDur = drawdownPhase ? drawdownPhase.duration : 0;

        if (bloomDur > 45) {
            suggestionsHTML += `<div class="suggestion-card">⏱️ <strong>Bloom Duration (${bloomDur}s):</strong> Your bloom phase ran quite long (>45s). Consider shortening the bloom to 30-35 seconds next time.</div>`;
        } else if (bloomDur > 0 && bloomDur < 25) {
            suggestionsHTML += `<div class="suggestion-card">🌱 <strong>Bloom Duration (${bloomDur}s):</strong> Your bloom was quick (<25s). Try extending it slightly.</div>`;
        }

        if (drawdownDur > 90) {
            suggestionsHTML += `<div class="suggestion-card">💧 <strong>Drawdown Slow (${drawdownDur}s):</strong> Final drawdown took over 1.5 minutes. Try a coarser grind setting.</div>`;
        } else if (drawdownDur > 0 && drawdownDur < 35) {
            suggestionsHTML += `<div class="suggestion-card">⚡ <strong>Drawdown Fast (${drawdownDur}s):</strong> Water drained very rapidly. Tighten your grind by 2-3 clicks.</div>`;
        }

        if (!suggestionsHTML) {
            suggestionsHTML = `<div class="suggestion-card">✨ <strong>Great Timing Profile!</strong> Your phase distribution ratios landed well within balanced parameters.</div>`;
        }

        document.getElementById('analytics-suggestions-box').innerHTML = suggestionsHTML;
    }

    function saveBrewSession() {
        activeBrew.score = document.getElementById('cup-score').value;
        activeBrew.notes = document.getElementById('cup-notes').value;
        activeBrew.phases = [...brewPhases];
        activeBrew.totalTime = stopwatchSeconds;
        activeBrew.date = new Date().toLocaleDateString();

        db.sessions.unshift(activeBrew);
        renderHistoryList();
        goToStep(4);
    }

    function renderHistoryList() {
        const container = document.getElementById('history-list-container');
        if (db.sessions.length === 0) {
            container.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted);">No archived brews found.</p>';
            return;
        }

        let html = '';
        db.sessions.forEach(s => {
            html += `
                <div class="item-card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <strong>${s.beanName}</strong>
                        <span>Score: <strong>${s.score}/10</strong></span>
                    </div>
                    <div style="color:var(--text-muted); font-size:0.8rem; margin-bottom:6px;">
                        Grind: ${s.grind} | Temp: ${s.temp}°C | Water: ${s.water}g | Total: ${s.totalTime}s (${s.date})
                    </div>
                    <div style="font-style:italic; font-size:0.8rem;">"${s.notes || 'No notes added'}"</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    updateBeanSelectDropdown();
</script>

</body>
</html>
