<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Pour-Over Master Tracker</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #2c2522;
            --text-muted: #786f6a;
            --accent: #8b5a2b;
            --accent-hover: #6f4520;
            --border-color: #e3ded5;
            --shadow: 0 4px 16px rgba(44, 37, 34, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 40px;
        }

        /* Navigation Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        .step-panel {
            display: none;
        }

        .step-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            background: var(--border-color);
            cursor: not-allowed;
        }

        /* Timer UI */
        .timer-display-box {
            position: relative;
            text-align: center;
            padding: 24px 0;
            background: #faf8f5;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .total-time-badge {
            position: absolute;
            top: 10px;
            right: 12px;
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        #timer-clock {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        #timer-stage-indicator {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
        }

        #timer-status-instruction {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Dynamic Multi-Gradient Compound Bar */
        .compound-bar-wrapper {
            margin: 20px 0;
        }

        .compound-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        #compound-bar-container {
            display: flex;
            height: 14px;
            width: 100%;
            background: var(--border-color);
            border-radius: 7px;
            overflow: hidden;
            gap: 2px;
            padding: 1px;
        }

        .bar-segment {
            height: 100%;
            transition: width 0.3s ease, background-color 0.3s ease, opacity 0.3s ease;
            border-radius: 3px;
        }

        /* Suggestion Card */
        .suggestion-card {
            background: #fff8f0;
            border-left: 4px solid var(--accent);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        /* Item Cards */
        .item-card {
            position: relative;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            background: #fff;
            transition: opacity 0.2s, background 0.2s;
        }

        .item-card.archived {
            background: #f0ede6;
            opacity: 0.65;
        }

        .item-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .badge {
            font-size: 0.7rem;
            background: #faf8f5;
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .card-actions button {
            margin-top: 0;
            padding: 6px 10px;
            font-size: 0.8rem;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .card-actions button:hover {
            background: var(--accent);
            color: white;
        }

        .card-actions button.danger {
            color: #7d6b5e;
            border-color: #bfaea2;
        }

        .card-actions button.danger:hover {
            background: #7d6b5e;
            color: white;
        }

        .history-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .history-top-bar h2 {
            font-size: 1.05rem;
            color: var(--accent);
        }

        /* Calendar Styles */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            margin-bottom: 16px;
        }

        .calendar-day-header {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 6px 0;
        }

        .calendar-cell {
            background: #faf8f5;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-height: 52px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-size: 0.8rem;
            cursor: default;
        }

        .calendar-cell.other-month {
            opacity: 0.35;
        }

        .calendar-cell.has-coffee {
            background: #fff8f0;
            border-color: var(--accent);
            cursor: pointer;
        }

        .calendar-cell .day-num {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .coffee-dot-container {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
        }

        .coffee-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
        }

        .profile-stat-box {
            background: #faf8f5;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
            font-size: 0.85rem;
        }

        .profile-stat-box h3 {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>Precision Pour-Over</h1>
        <div class="nav-links">
            <a id="nav-brew" onclick="attemptNav(1)" class="active">Brew</a>
            <a id="nav-beans" onclick="attemptNav(5)">Beans</a>
            <a id="nav-profile" onclick="attemptNav(6)">Profile</a>
            <a id="nav-history" onclick="attemptNav(4)">History</a>
        </div>
    </div>

    <!-- STEP 1: BREW PARAMETERS -->
    <div id="step-1" class="step-panel active">
        <div class="form-group">
            <label>Bean Selection</label>
            <select id="bean-select" onchange="checkBeanSelect()">
                <option value="" disabled selected>-- Select a Bean Profile --</option>
                <option value="new">+ Add New Bean Profile</option>
            </select>
        </div>

        <div id="new-bean-section" style="display: none; background: #faf8f5; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color);">
            <div class="form-group">
                <label>Name (e.g. Yirgacheffe)</label>
                <input type="text" id="bean-name" placeholder="e.g. Yirgacheffe">
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Bean Origin</label>
                    <input type="text" id="bean-origin" placeholder="e.g. Ethiopia">
                </div>
                <div class="form-group">
                    <label>Roastery / Café (Optional)</label>
                    <input type="text" id="bean-roastery" placeholder="e.g. Onyx Coffee Lab">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Roast Level</label>
                    <select id="bean-roast">
                        <option value="Light">Light</option>
                        <option value="Medium-Light">Medium-Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Medium-Dark">Medium-Dark</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Flavour Profile Tag</label>
                    <select id="bean-flavor-type">
                        <option value="Fruity">Fruity</option>
                        <option value="Nutty">Nutty</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 8px;">
                <label>Specific Tasting Notes (comma separated)</label>
                <input type="text" id="bean-flavor" placeholder="e.g. Peach, Chocolate, Vanilla">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Grind Setting (Clicks)</label>
                <input type="number" id="param-grind" value="21">
            </div>
            <div class="form-group">
                <label>Water Temp (°C)</label>
                <input type="number" id="param-temp" value="92">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Coffee Dose (g)</label>
                <input type="number" id="param-coffee" value="15">
            </div>
            <div class="form-group">
                <label>Water Weight (g)</label>
                <input type="number" id="param-water" value="250">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Use Bloom Phase?</label>
                <select id="param-bloom">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="form-group">
                <label>Number of Pours</label>
                <input type="number" id="param-pours" min="0" value="2">
            </div>
        </div>

        <button onclick="startTimerSetup()" id="proceed-brew-btn" disabled>Proceed to Stopwatch</button>
    </div>

    <!-- STEP 2: PRE-SET PHASE TIMER -->
    <div id="step-2" class="step-panel">
        <div class="timer-display-box">
            <div class="total-time-badge">Total: <span id="total-time-display">0:00</span></div>
            <div id="timer-clock">0:00</div>
            <div id="timer-stage-indicator">Stage: Ready</div>
            <div id="timer-status-instruction">Tap below to start phase</div>
        </div>

        <div class="compound-bar-wrapper">
            <div class="compound-bar-label">
                <span>Phase Progression Bar</span>
                <span id="total-logged-time">0s elapsed</span>
            </div>
            <div id="compound-bar-container">
                <div class="bar-segment" style="width: 100%; background: var(--border-color); opacity: 0.4;"></div>
            </div>
        </div>

        <button id="timer-action-btn" onclick="handlePresetPhaseClick()">Start Timer</button>
        <button onclick="attemptNav(1)" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: 8px;">Cancel / Edit Params</button>
    </div>

    <!-- STEP 3: RATING & COMMENTS -->
    <div id="step-3" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Brew Complete Analysis & Comments</h2>
        
        <div id="analytics-suggestions-box"></div>

        <div class="form-group">
            <label>Overall Cup Score (1 - 10)</label>
            <input type="number" id="cup-score" min="1" max="10" value="8" step="0.1">
        </div>

        <div class="form-group">
            <label>General Comments / Notes</label>
            <textarea id="cup-notes" rows="3" placeholder="Tasting observations, brewer notes..."></textarea>
        </div>

        <button onclick="saveBrewSession()">Save & Return to Brew</button>
    </div>

    <!-- STEP 4: HISTORY (GROUPED BY BEAN PROFILE) & CALENDAR -->
    <div id="step-4" class="step-panel">
        <div class="history-top-bar">
            <h2>Brew History</h2>
            <button onclick="toggleCalendarView()" id="calendar-toggle-btn" style="width: auto; margin-top: 0; padding: 6px 12px; font-size: 0.85rem;">📅 View Calendar</button>
        </div>
        
        <div id="history-view-container">
            <div id="history-content-container"></div>
        </div>

        <div id="calendar-view-container" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <button onclick="changeMonth(-1)" style="width: auto; margin-top:0; padding: 4px 10px; font-size: 0.8rem; background: transparent; color: var(--accent); border: 1px solid var(--accent);">&larr; Prev</button>
                <strong id="calendar-month-year" style="font-size: 0.95rem; color: var(--accent);"></strong>
                <button onclick="changeMonth(1)" style="width: auto; margin-top:0; padding: 4px 10px; font-size: 0.8rem; background: transparent; color: var(--accent); border: 1px solid var(--accent);">Next &rarr;</button>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-header">Su</div>
                <div class="calendar-day-header">Mo</div>
                <div class="calendar-day-header">Tu</div>
                <div class="calendar-day-header">We</div>
                <div class="calendar-day-header">Th</div>
                <div class="calendar-day-header">Fr</div>
                <div class="calendar-day-header">Sa</div>
            </div>
            <div id="calendar-days-grid" class="calendar-grid"></div>
            <div id="calendar-day-details" style="margin-top: 16px;"></div>
        </div>

        <button onclick="attemptNav(1)" style="margin-top: 16px;">Back to Brew</button>
    </div>

    <!-- STEP 5: BEAN INVENTORY -->
    <div id="step-5" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Bean Inventory</h2>
        
        <div style="background: #faf8f5; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color);">
            <div class="form-group" style="margin-bottom: 10px;">
                <label id="mgr-form-title">Add New Bean Inventory</label>
                <input type="text" id="mgr-name" placeholder="Name (e.g. Yirgacheffe)">
            </div>
            <div class="row" style="margin-bottom: 10px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Bean Origin</label>
                    <input type="text" id="mgr-origin" placeholder="e.g. Ethiopia">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Roastery / Café (Optional)</label>
                    <input type="text" id="mgr-roastery" placeholder="e.g. Onyx">
                </div>
            </div>
            <div class="row" style="margin-bottom: 10px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Roast Level</label>
                    <select id="mgr-roast">
                        <option value="Light">Light</option>
                        <option value="Medium-Light">Medium-Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Medium-Dark">Medium-Dark</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Flavour Profile Tag</label>
                    <select id="mgr-flavor-type">
                        <option value="Fruity">Fruity</option>
                        <option value="Nutty">Nutty</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 8px;">
                <label>Specific Tasting Notes</label>
                <input type="text" id="mgr-flavor" placeholder="e.g. Peach, Chocolate">
            </div>
            <input type="hidden" id="mgr-edit-id" value="">
            <button onclick="saveBeanFromManager()" id="mgr-save-btn" style="margin-top: 10px;">Save Bean Profile</button>
            <button id="mgr-cancel-btn" onclick="resetBeanManagerForm()" style="display:none; background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: 6px;">Cancel Edit</button>
        </div>

        <div id="bean-manager-list"></div>
        <button onclick="attemptNav(1)" style="margin-top: 16px;">Back to Brew</button>
    </div>

    <!-- STEP 6: PREFERRED COFFEE PROFILE DASHBOARD -->
    <div id="step-6" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Preferred Coffee Profile</h2>
        <div id="taster-profile-content"></div>
        <button onclick="attemptNav(1)" style="margin-top: 16px;">Back to Brew</button>
    </div>
</div>

<script>
    const db = {
        beans: JSON.parse(localStorage.getItem('pour_over_beans')) || [],
        sessions: JSON.parse(localStorage.getItem('pour_over_sessions')) || []
    };

    function persistData() {
        localStorage.setItem('pour_over_beans', JSON.stringify(db.beans));
        localStorage.setItem('pour_over_sessions', JSON.stringify(db.sessions));
    }

    let activeBrew = {};
    let brewPhases = [];
    let currentPhaseIndex = 0;
    let roundSecondsElapsed = 0;
    let totalSecondsElapsed = 0;
    let timerInterval = null;
    let isTimerRunning = false;
    let currentStep = 1;
    
    // Calendar navigation state
    let calendarCurrentDate = new Date();
    let isCalendarMode = false;

    window.addEventListener('beforeunload', (e) => {
        if (isTimerRunning || currentStep === 2) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    function attemptNav(stepNum) {
        if (currentStep === 2 && stepNum !== 2) {
            if (!confirm("Are you sure you want to leave? Active timer will be lost.")) return;
            if (timerInterval) clearInterval(timerInterval);
            isTimerRunning = false;
        }
        goToStep(stepNum);
    }

    function goToStep(stepNum) {
        currentStep = stepNum;
        document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`step-${stepNum}`).classList.add('active');

        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        if (stepNum === 1 || stepNum === 2 || stepNum === 3) document.getElementById('nav-brew').classList.add('active');
        if (stepNum === 5) document.getElementById('nav-beans').classList.add('active');
        if (stepNum === 6) document.getElementById('nav-profile').classList.add('active');
        if (stepNum === 4) document.getElementById('nav-history').classList.add('active');

        if (stepNum === 1) updateBeanSelectDropdown();
        if (stepNum === 2) initPresetTimerSession();
        if (stepNum === 4) { isCalendarMode = false; updateHistoryViewMode(); renderHistoryContent(); }
        if (stepNum === 5) renderBeanManager();
        if (stepNum === 6) renderPreferredProfile();
    }

    function updateBeanSelectDropdown() {
        const select = document.getElementById('bean-select');
        select.innerHTML = '<option value="" disabled selected>-- Select a Bean Profile --</option>';
        db.beans.filter(b => !b.archived).forEach((b) => {
            const opt = document.createElement('option');
            opt.value = b.id || ('b_legacy_' + Math.random());
            opt.textContent = `${b.name} (${b.origin || 'Unknown Origin'}) - ${b.roast}`;
            select.appendChild(opt);
        });
        select.innerHTML += '<option value="new">+ Add New Bean Profile</option>';
        checkBeanSelect();
    }

    function checkBeanSelect() {
        const val = document.getElementById('bean-select').value;
        document.getElementById('new-bean-section').style.display = (val === 'new') ? 'block' : 'none';
        document.getElementById('proceed-brew-btn').disabled = (val === '');
    }

    function startTimerSetup() {
        if (document.getElementById('bean-select').value === '') return;

        const bloom = document.getElementById('param-bloom').value;
        const pours = parseInt(document.getElementById('param-pours').value) || 0;

        if (bloom === 'No' && pours === 0) {
            alert("Sorry, no trolls allowed");
            document.getElementById('param-pours').value = 2;
            return;
        }

        goToStep(2);
    }

    function initPresetTimerSession() {
        const val = document.getElementById('bean-select').value;
        let matchedBean = null;
        if (val === 'new') {
            const name = document.getElementById('bean-name').value.trim() || 'Yirgacheffe';
            const origin = document.getElementById('bean-origin').value.trim() || 'Ethiopia';
            const roastery = document.getElementById('bean-roastery').value.trim();
            const roast = document.getElementById('bean-roast').value;
            const flavorType = document.getElementById('bean-flavor-type').value;
            const flavor = document.getElementById('bean-flavor').value;
            matchedBean = { id: 'b_' + Date.now(), name, origin, roastery, roast, flavorType, flavor, archived: false };
            db.beans.push(matchedBean);
            persistData();
        } else {
            matchedBean = db.beans.find(x => x.id === val);
        }
        
        activeBrew.beanName = matchedBean ? matchedBean.name : 'Unknown';
        activeBrew.origin = matchedBean && matchedBean.origin ? matchedBean.origin : 'Unknown';
        activeBrew.roastery = matchedBean && matchedBean.roastery ? matchedBean.roastery : '';
        activeBrew.roast = matchedBean ? matchedBean.roast : 'Medium';
        activeBrew.flavorType = matchedBean && matchedBean.flavorType ? matchedBean.flavorType : 'Fruity';
        activeBrew.grind = document.getElementById('param-grind').value;
        activeBrew.temp = document.getElementById('param-temp').value;
        activeBrew.coffee = document.getElementById('param-coffee').value;
        activeBrew.water = document.getElementById('param-water').value;
        activeBrew.bloom = document.getElementById('param-bloom').value;
        activeBrew.pours = parseInt(document.getElementById('param-pours').value) || 2;
        
        brewPhases = [];
        
        if (activeBrew.bloom === 'Yes') {
            brewPhases.push({ name: 'Bloom', duration: 0, color: '#8b5a2b' });
        }

        for (let i = 1; i <= activeBrew.pours; i++) {
            if (brewPhases.length > 0) {
                brewPhases.push({ name: 'Extracting', duration: 0, color: '#b58a5a' });
            }
            brewPhases.push({ name: `Pour ${i}`, duration: 0, color: '#c29b61' });
        }

        brewPhases.push({ name: 'Drawdown', duration: 0, color: '#d4b58a' });

        currentPhaseIndex = 0;
        roundSecondsElapsed = 0;
        totalSecondsElapsed = 0;
        isTimerRunning = false;
        
        document.getElementById('timer-clock').textContent = '0:00';
        document.getElementById('total-time-display').textContent = '0:00';
        document.getElementById('timer-stage-indicator').textContent = 'Stage: ' + brewPhases[0].name;
        document.getElementById('timer-status-instruction').textContent = 'Tap to start timer & begin phase';
        document.getElementById('timer-action-btn').textContent = 'Start Timer';
        document.getElementById('total-logged-time').textContent = '0s elapsed';
        updatePresetCompoundBar();
    }

    function handlePresetPhaseClick() {
        if (!isTimerRunning) {
            isTimerRunning = true;
            roundSecondsElapsed = 0;
            totalSecondsElapsed = 0;
            
            timerInterval = setInterval(() => {
                roundSecondsElapsed++;
                totalSecondsElapsed++;

                const rMins = Math.floor(roundSecondsElapsed / 60);
                const rSecs = roundSecondsElapsed % 60;
                document.getElementById('timer-clock').textContent = `${rMins}:${rSecs < 10 ? '0' : ''}${rSecs}`;

                const tMins = Math.floor(totalSecondsElapsed / 60);
                const tSecs = totalSecondsElapsed % 60;
                document.getElementById('total-time-display').textContent = `${tMins}:${tSecs < 10 ? '0' : ''}${tSecs}`;
                
                brewPhases[currentPhaseIndex].duration = roundSecondsElapsed;
                updatePresetCompoundBar();
            }, 1000);

            document.getElementById('timer-status-instruction').textContent = 'Tap to advance to next stage';
            document.getElementById('timer-action-btn').textContent = 'Next Stage (' + brewPhases[1].name + ')';
        } else {
            brewPhases[currentPhaseIndex].duration = roundSecondsElapsed > 0 ? roundSecondsElapsed : 1;
            roundSecondsElapsed = 0;
            document.getElementById('timer-clock').textContent = '0:00';

            currentPhaseIndex++;

            if (currentPhaseIndex >= brewPhases.length) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('timer-clock').textContent = 'Done';
                document.getElementById('timer-stage-indicator').textContent = 'Brew Complete!';
                document.getElementById('timer-status-instruction').textContent = 'All sequence phases captured.';
                document.getElementById('timer-action-btn').textContent = 'Proceed to Rating & Comments';
                document.getElementById('timer-action-btn').onclick = () => {
                    generateSuggestions(activeBrew);
                    goToStep(3);
                };
            } else {
                document.getElementById('timer-stage-indicator').textContent = 'Stage: ' + brewPhases[currentPhaseIndex].name;
                const nextPhase = brewPhases[currentPhaseIndex + 1];
                if (nextPhase) {
                    document.getElementById('timer-action-btn').textContent = 'Next Stage (' + nextPhase.name + ')';
                } else {
                    document.getElementById('timer-action-btn').textContent = 'Finish Brew';
                }
            }
        }
        updatePresetCompoundBar();
    }

    function updatePresetCompoundBar() {
        const container = document.getElementById('compound-bar-container');
        container.innerHTML = '';
        
        const estimatedTotalDuration = Math.max(180, totalSecondsElapsed + (brewPhases.length - currentPhaseIndex) * 30);

        brewPhases.forEach((p, idx) => {
            if (idx <= currentPhaseIndex) {
                let dur = p.duration > 0 ? p.duration : (idx === currentPhaseIndex && isTimerRunning ? (roundSecondsElapsed > 0 ? roundSecondsElapsed : 5) : 5);
                if (dur < 1) dur = 1;
                const pct = (dur / estimatedTotalDuration) * 100;

                let opacity = (idx < currentPhaseIndex) ? '1' : '0.9';
                let segmentColor = (idx === currentPhaseIndex && isTimerRunning) ? '#6f4520' : p.color;

                container.innerHTML += `<div class="bar-segment" style="width: ${pct}%; background: ${segmentColor}; opacity: ${opacity};" title="${p.name}: ${dur}s"></div>`;
            }
        });

        if (currentPhaseIndex < brewPhases.length - 1) {
            container.innerHTML += `<div class="bar-segment" style="flex-grow: 1; background: var(--border-color); opacity: 0.4;" title="Remaining Stages"></div>`;
        }

        document.getElementById('total-logged-time').textContent = totalSecondsElapsed + 's elapsed';
    }

    function generateSuggestions(brew) {
        let tip = "Your parameters look well balanced. Keep track of extraction time to ensure even drawdown.";
        const score = parseFloat(brew.score) || 8;
        const grind = parseInt(brew.grind);

        if (score < 7) {
            tip = grind < 20 ? "<strong>Optimization Tip:</strong> Cup score was low with a fine grind. Try coarser clicks." : "<strong>Optimization Tip:</strong> Consider increasing water temperature or grinding slightly finer.";
        } else {
            tip = `<strong>Great Brew!</strong> Your grind setting of ${grind} clicks worked nicely. Replicate these parameters for consistency.`;
        }
        document.getElementById('analytics-suggestions-box').innerHTML = `<div class="suggestion-card">${tip}</div>`;
    }

    function saveBrewSession() {
        activeBrew.score = parseFloat(document.getElementById('cup-score').value) || 8;
        activeBrew.notes = document.getElementById('cup-notes').value;
        activeBrew.date = new Date().toLocaleDateString();
        db.sessions.unshift(activeBrew);
        persistData();
        
        document.getElementById('timer-action-btn').onclick = handlePresetPhaseClick;
        goToStep(1);
    }

    function renderBeanManager() {
        const container = document.getElementById('bean-manager-list');
        container.innerHTML = db.beans.length === 0 ? '<p style="font-size: 0.85rem; color: var(--text-muted);">No beans added.</p>' : '';
        db.beans.forEach((b) => {
            const badgeText = `${b.roast || 'Medium'} | ${b.flavorType || 'Fruity'}`;
            container.innerHTML += `
                <div class="item-card ${b.archived ? 'archived' : ''}">
                    <div class="item-card-header">
                        <strong>${b.name}</strong>
                        <span class="badge">${badgeText}</span>
                    </div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Origin: ${b.origin || 'Unknown'} | Roastery: ${b.roastery || 'N/A'}</div>
                    <div style="font-size: 0.8rem; color: var(--accent);">Notes: ${b.flavor || 'None specified'}</div>
                    <div class="card-actions">
                        <button onclick="editBean('${b.id}')">Edit</button>
                        <button class="danger" onclick="toggleArchiveBean('${b.id}')">${b.archived ? 'Unarchive' : 'Archive'}</button>
                        <button class="danger" onclick="deleteBean('${b.id}')">Delete</button>
                    </div>
                </div>
            `;
        });
    }

    function saveBeanFromManager() {
        const id = document.getElementById('mgr-edit-id').value;
        const name = document.getElementById('mgr-name').value.trim();
        if (!name) { alert('Please enter a bean name.'); return; }
        const origin = document.getElementById('mgr-origin').value.trim();
        const roastery = document.getElementById('mgr-roastery').value.trim();
        const roast = document.getElementById('mgr-roast').value;
        const flavorType = document.getElementById('mgr-flavor-type').value;
        const flavor = document.getElementById('mgr-flavor').value;

        if (id) {
            const b = db.beans.find(x => x.id === id);
            if (b) { b.name = name; b.origin = origin; b.roastery = roastery; b.roast = roast; b.flavorType = flavorType; b.flavor = flavor; }
        } else {
            db.beans.push({ id: 'b_' + Date.now(), name, origin, roastery, roast, flavorType, flavor, archived: false });
        }
        persistData();
        resetBeanManagerForm();
        renderBeanManager();
    }

    function editBean(id) {
        const b = db.beans.find(x => x.id === id);
        if (!b) return;
        document.getElementById('mgr-edit-id').value = b.id;
        document.getElementById('mgr-name').value = b.name;
        document.getElementById('mgr-origin').value = b.origin || '';
        document.getElementById('mgr-roastery').value = b.roastery || '';
        document.getElementById('mgr-roast').value = b.roast || 'Light';
        document.getElementById('mgr-flavor-type').value = b.flavorType || 'Fruity';
        document.getElementById('mgr-flavor').value = b.flavor || '';
        document.getElementById('mgr-form-title').textContent = 'Edit Bean Profile';
        document.getElementById('mgr-save-btn').textContent = 'Update Bean Profile';
        document.getElementById('mgr-cancel-btn').style.display = 'block';
    }

    function resetBeanManagerForm() {
        document.getElementById('mgr-edit-id').value = '';
        document.getElementById('mgr-name').value = '';
        document.getElementById('mgr-origin').value = '';
        document.getElementById('mgr-roastery').value = '';
        document.getElementById('mgr-flavor').value = '';
        document.getElementById('mgr-form-title').textContent = 'Add New Bean Inventory';
        document.getElementById('mgr-save-btn').textContent = 'Save Bean Profile';
        document.getElementById('mgr-cancel-btn').style.display = 'none';
    }

    function toggleArchiveBean(id) {
        const b = db.beans.find(x => x.id === id);
        if (b) { b.archived = !b.archived; persistData(); renderBeanManager(); }
    }

    function deleteBean(id) {
        if (!confirm("Are you sure you want to delete this bean profile?")) return;
        db.beans = db.beans.filter(x => x.id !== id);
        persistData();
        renderBeanManager();
    }

    function toggleCalendarView() {
        isCalendarMode = !isCalendarMode;
        updateHistoryViewMode();
        if (isCalendarMode) renderCalendar();
    }

    function updateHistoryViewMode() {
        document.getElementById('history-view-container').style.display = isCalendarMode ? 'none' : 'block';
        document.getElementById('calendar-view-container').style.display = isCalendarMode ? 'block' : 'none';
        document.getElementById('calendar-toggle-btn').textContent = isCalendarMode ? '📜 View List' : '📅 View Calendar';
    }

    function changeMonth(dir) {
        calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() + dir);
        renderCalendar();
    }

    function renderCalendar() {
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const year = calendarCurrentDate.getFullYear();
        const month = calendarCurrentDate.getMonth();

        document.getElementById('calendar-month-year').textContent = `${monthNames[month]} ${year}`;
        document.getElementById('calendar-day-details').innerHTML = '';

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const prevTotalDays = new Date(year, month, 0).getDate();

        const grid = document.getElementById('calendar-days-grid');
        grid.innerHTML = '';

        // Map sessions by date string for quick lookup
        const sessionsByDate = {};
        db.sessions.forEach(s => {
            if (!sessionsByDate[s.date]) sessionsByDate[s.date] = [];
            sessionsByDate[s.date].push(s);
        });

        // Previous month trailing days
        for (let i = firstDayIndex - 1; i >= 0; i--) {
            const dayNum = prevTotalDays - i;
            grid.innerHTML += `<div class="calendar-cell other-month"><span class="day-num">${dayNum}</span></div>`;
        }

        // Current month days
        for (let day = 1; day <= totalDays; day++) {
            const dateObj = new Date(year, month, day);
            const dateStr = dateObj.toLocaleDateString();
            const daySessions = sessionsByDate[dateStr] || [];
            const hasCoffee = daySessions.length > 0;

            let dotsHtml = '';
            if (hasCoffee) {
                dotsHtml = '<div class="coffee-dot-container">';
                daySessions.forEach(() => {
                    dotsHtml += '<div class="coffee-dot"></div>';
                });
                dotsHtml += '</div>';
            }

            const cellClass = `calendar-cell ${hasCoffee ? 'has-coffee' : ''}`;
            const clickAttr = hasCoffee ? `onclick="showCalendarDaySessions('${dateStr}')"` : '';

            grid.innerHTML += `
                <div class="${cellClass}" ${clickAttr}>
                    <span class="day-num">${day}</span>
                    ${dotsHtml}
                </div>
            `;
        }

        // Next month leading days to complete grid rows
        const totalCellsRendered = firstDayIndex + totalDays;
        const remainingCells = (totalCellsRendered % 7 === 0) ? 0 : 7 - (totalCellsRendered % 7);
        for (let day = 1; day <= remainingCells; day++) {
            grid.innerHTML += `<div class="calendar-cell other-month"><span class="day-num">${day}</span></div>`;
        }
    }

    function showCalendarDaySessions(dateStr) {
        const daySessions = db.sessions.filter(s => s.date === dateStr);
        const detailsContainer = document.getElementById('calendar-day-details');
        
        let html = `<h3 style="font-size: 0.9rem; color: var(--accent); margin-bottom: 8px;">Brews on ${dateStr} (${daySessions.length}):</h3>`;
        daySessions.forEach((s, idx) => {
            html += `
                <div class="item-card" style="background: #faf8f5; margin-bottom: 8px;">
                    <div class="item-card-header">
                        <strong>Cup #${idx + 1}: ${s.beanName}</strong>
                        <span class="badge">Score: ${s.score} / 10</span>
                    </div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">
                        Grind: ${s.grind}c | Temp: ${s.temp}°C | Dose/Water: ${s.coffee}g / ${s.water}g
                    </div>
                    <div style="font-size: 0.8rem; color: var(--accent);">Comment: "${s.notes || 'None'}"</div>
                </div>
            `;
        });
        detailsContainer.innerHTML = html;
    }

    function renderHistoryContent() {
        const container = document.getElementById('history-content-container');
        if (db.sessions.length === 0) {
            container.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted);">No brew sessions logged yet.</p>';
            return;
        }

        // Group sessions by bean name
        const groups = {};
        db.sessions.forEach(s => {
            const name = s.beanName || 'Unknown Bean';
            if (!groups[name]) groups[name] = [];
            groups[name].push(s);
        });

        // Compute averages and best cup for sorting
        const groupList = Object.keys(groups).map(beanName => {
            const list = groups[beanName];
            const avgScore = list.reduce((acc, curr) => acc + (curr.score || 0), 0) / list.length;
            const bestSession = list.reduce((best, curr) => (curr.score > best.score ? curr : best), list[0]);
            return { beanName, list, avgScore, bestSession };
        });

        // Sort beans by highest average score first
        groupList.sort((a, b) => b.avgScore - a.avgScore);

        let html = '';
        groupList.forEach(g => {
            html += `
                <div class="item-card" style="background: #faf8f5;">
                    <div class="item-card-header">
                        <strong>${g.beanName}</strong>
                        <span class="badge">Avg Score: ${g.avgScore.toFixed(1)} / 10 (${g.list.length} brew${g.list.length > 1 ? 's' : ''})</span>
                    </div>
                    <div style="font-size: 0.8rem; color: var(--accent); margin-bottom: 6px;">
                        ⭐ <strong>Best Cup Specs:</strong> Score: ${g.bestSession.score} | Grind: ${g.bestSession.grind} clicks | Temp: ${g.bestSession.temp}°C | Ratio: ${g.bestSession.coffee}g / ${g.bestSession.water}g (${g.bestSession.date})
                    </div>
                    <div style="font-size: 0.78rem; color: var(--text-muted);">
                        <strong>Recent logs:</strong>
                        <ul style="margin-left: 16px; margin-top: 4px;">
                            ${g.list.map(s => `<li>${s.date} — Score: ${s.score} | Grind: ${s.grind}c | Comment: "${s.notes || 'None'}"</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function renderPreferredProfile() {
        const container = document.getElementById('taster-profile-content');
        const activeBeans = db.beans.filter(b => !b.archived);

        if (activeBeans.length < 3) {
            container.innerHTML = `<div class="profile-stat-box"><p style="font-size: 0.85rem; color: var(--text-muted);">Insufficient data to generate profile</p></div>`;
            return;
        }

        container.innerHTML = `
            <div class="profile-stat-box">
                <h3>Active Inventory Insights</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted);">You have ${activeBeans.length} active bean profiles logged. Your preferred roast tends toward light-to-medium origins with fruity tasting notes.</p>
            </div>
        `;
    }

    updateBeanSelectDropdown();
</script>

</body>
