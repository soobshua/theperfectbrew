<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewLog — Specialty Coffee Journal & Optimizer</title>
    <style>
        :root {
            --bg-color: #F7F5F0;
            --card-bg: #FFFFFF;
            --text-main: #2C2825;
            --text-muted: #78716C;
            --accent-beige: #D4C5B9;
            --accent-olive: #606C38;
            --accent-terracotta: #BC6C25;
            --border-color: #E6E2DD;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Header & Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        nav {
            display: flex;
            gap: 0.5rem;
            background: var(--card-bg);
            padding: 0.35rem;
            border-radius: 99px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .nav-btn {
            background: transparent;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .nav-btn.active {
            background: var(--text-main);
            color: var(--bg-color);
        }

        /* Views */
        .view {
            display: none;
            flex-direction: column;
            gap: 1.25rem;
            animation: fadeIn 0.4s ease forwards;
        }

        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dashboard Hero Elements */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .widget-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .widget-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            border-color: var(--accent-beige);
        }

        .widget-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .widget-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .widget-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .widget-card::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 6px;
            font-size: 0.65rem;
            color: var(--accent-terracotta);
            opacity: 0.8;
        }

        /* Cards & Containers */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.01);
        }

        /* Action Card for Logging on Main Page */
        .action-card {
            background: linear-gradient(135deg, var(--text-main), #4A4540);
            color: var(--bg-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .action-card:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .action-card h3, .action-card p {
            color: var(--bg-color);
        }

        .action-card h3 {
            font-size: 1.15rem;
            margin-bottom: 0.25rem;
        }

        .action-card p {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            font-size: 0.95rem;
            color: var(--text-main);
            transition: var(--transition);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--text-main);
            background: var(--card-bg);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            text-align: center;
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(0.99);
        }

        .btn-secondary {
            background: var(--accent-beige);
            color: var(--text-main);
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        /* Multi-step Flow Container */
        .step-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .step-hidden {
            display: none !important;
        }

        /* Timer & Fitness Ring UI (Segmented Live Accumulation) */
        .timer-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem 0;
        }

        .ring-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .ring-bg {
            fill: none;
            stroke: var(--border-color);
            stroke-width: 16;
        }

        .ring-segment {
            fill: none;
            stroke-width: 16;
            stroke-linecap: round;
        }

        .timer-center-btn {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 4px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            transition: var(--transition);
        }

        .timer-center-btn:hover {
            transform: scale(1.02);
            border-color: var(--accent-olive);
        }

        .timer-state-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .timer-display {
            font-size: 2.25rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .timer-status-text {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-terracotta);
            text-align: center;
        }

        /* Calendar View */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .cal-day-header {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 0.5rem 0;
        }

        .cal-cell {
            aspect-ratio: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .cal-cell:hover {
            border-color: var(--text-main);
        }

        .cal-cell.has-brew::after {
            content: '';
            width: 6px;
            height: 6px;
            background-color: var(--accent-olive);
            border-radius: 50%;
            margin-top: 2px;
        }

        .cal-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        /* Modal Overlay */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 16px 32px rgba(0,0,0,0.12);
            animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            align-self: flex-end;
            background: transparent;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* Coffee Card Item */
        .coffee-card-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .coffee-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .coffee-card-bean {
            font-weight: 700;
            font-size: 1rem;
        }

        .coffee-card-score {
            background: var(--accent-olive);
            color: #fff;
            padding: 0.25rem 0.6rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .coffee-card-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .coffee-card-notes {
            font-size: 0.85rem;
            font-style: italic;
            border-left: 2px solid var(--accent-beige);
            padding-left: 0.5rem;
            color: var(--text-main);
        }

        /* Stats & Optimizer View */
        .optimizer-box {
            background: var(--accent-beige);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .optimizer-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .optimizer-text {
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-main);
        }

        .bean-tips-box {
            background: #F0EDE6;
            border-left: 3px solid var(--accent-terracotta);
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>BrewLog</h1>
            <nav>
                <button class="nav-btn active" onclick="switchTab('dashboard')">Home</button>
                <button class="nav-btn" onclick="switchTab('stats')">Analytics</button>
            </nav>
        </header>

        <!-- DASHBOARD VIEW -->
        <section id="view-dashboard" class="view active">
            <div class="hero-grid">
                <div class="widget-card" onclick="openProfileModal()" data-tooltip="Click to see your perfect brew">
                    <div class="widget-icon">☕</div>
                    <div class="widget-title">Taster Profile</div>
                    <div class="widget-sub" id="profile-snippet">Click to inspect profile</div>
                </div>
                <div class="widget-card" onclick="openCalendarModal()" data-tooltip="See past brews">
                    <div class="widget-icon">📅</div>
                    <div class="widget-title">Brew Calendar</div>
                    <div class="widget-sub">View brew history</div>
                </div>
            </div>

            <div class="action-card" onclick="switchTab('log')">
                <h3>+ Log New Cup</h3>
            </div>
        </section>

        <!-- NEW CUP LOG VIEW -->
        <section id="view-log" class="view">
            <div class="card">
                <h2 style="font-size: 1.2rem; margin-bottom: 1rem;" id="log-form-title">Log New Brew</h2>
                
                <!-- Step 1: Bean Selection -->
                <div id="step-beans" class="step-container">
                    <div class="form-group">
                        <label>Select Existing Bean or Add New</label>
                        <select id="bean-select" onchange="handleBeanSelectChange()">
                            <option value="new">+ Add New Bean</option>
                        </select>
                    </div>

                    <div id="new-bean-fields" style="display: flex; flex-direction: column; gap: 1rem;">
                        <div class="form-group">
                            <label>Bean Name & Origin</label>
                            <input type="text" id="bean-name" placeholder="e.g. Ethiopia Yirgacheffe (Roastery X)">
                        </div>
                        <div class="row">
                            <div class="form-group">
                                <label>Roast Level</label>
                                <select id="bean-roast">
                                    <option value="Light">Light</option>
                                    <option value="Medium-Light">Medium-Light</option>
                                    <option value="Medium" selected>Medium</option>
                                    <option value="Medium-Dark">Medium-Dark</option>
                                    <option value="Dark">Dark</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Flavor Profile Tags</label>
                                <input type="text" id="bean-flavor" placeholder="e.g. Jasmine, Bergamot, Peach">
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic Bean Tips Container -->
                    <div id="bean-tips-container" class="bean-tips-box"></div>

                    <button class="btn" style="margin-top: 0.5rem;" onclick="goToStep(2)">Next: Grind & Ratio</button>
                </div>

                <!-- Step 2: Grind, Ratio & Temp -->
                <div id="step-params" class="step-container step-hidden">
                    <div class="row">
                        <div class="form-group">
                            <label>Grind Size (Clicks)</label>
                            <input type="number" id="param-grind" placeholder="e.g. 21" value="20">
                        </div>
                        <div class="form-group">
                            <label>Water Temp (°C)</label>
                            <input type="number" id="param-temp" placeholder="e.g. 92" value="92">
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label>Coffee Weight (g)</label>
                            <input type="number" id="param-coffee" placeholder="15" value="15">
                        </div>
                        <div class="form-group">
                            <label>Water Weight (g)</label>
                            <input type="number" id="param-water" placeholder="300" value="250">
                        </div>
                    </div>
                    
                    <hr style="border: none; border-top: 1px solid var(--border-color); margin: 0.5rem 0;">

                    <div class="row">
                        <div class="form-group">
                            <label>Include Bloom Phase?</label>
                            <select id="param-bloom">
                                <option value="yes" selected>Yes</option>
                                <option value="no">No</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Number of Pours</label>
                            <input type="number" id="param-pours" min="1" max="5" value="2">
                        </div>
                    </div>

                    <div class="button-group">
                        <button class="btn btn-secondary" onclick="goToStep(1)">Back</button>
                        <button class="btn" onclick="startTimerSession()">Start Brew Timer</button>
                    </div>
                </div>

                <!-- Step 3: Timer & Fitness Ring -->
                <div id="step-timer" class="step-container step-hidden">
                    <div class="timer-view">
                        <div class="timer-status-text" id="timer-status-instruction">Ready to Bloom</div>
                        
                        <div class="ring-container">
                            <svg class="ring-svg" viewBox="0 0 100 100" id="ring-svg-element">
                                <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
                                <!-- Segments injected dynamically as timer progresses -->
                            </svg>
                            <button class="timer-center-btn" onclick="handleTimerButtonPress()">
                                <span class="timer-state-label" id="timer-action-label">Tap to Start</span>
                                <span class="timer-display" id="timer-clock">0:00</span>
                            </button>
                        </div>

                        <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center;" id="timer-phase-counter">
                            Phase 0 of 0
                        </div>
                    </div>

                    <button class="btn btn-secondary" onclick="goToStep(2)">Back</button>
                </div>

                <!-- Step 4: Rating & Notes -->
                <div id="step-complete" class="step-container step-hidden">
                    <div class="form-group">
                        <label>Rank Cup (Out of 10)</label>
                        <input type="number" id="complete-rank" min="1" max="10" value="8" step="0.5">
                    </div>
                    <div class="form-group">
                        <label>Tasting Notes & Reflections</label>
                        <textarea id="complete-notes" rows="3" placeholder="Clean cup, balanced acidity, sweet finish..."></textarea>
                    </div>
                    <div class="button-group">
                        <button class="btn btn-secondary" onclick="goToStep(3)">Back</button>
                        <button class="btn" onclick="saveBrewCard()">Save Brew Card</button>
                    </div>
                </div>

            </div>
        </section>

        <!-- ANALYTICS VIEW -->
        <section id="view-stats" class="view">
            <div class="card">
                <h2 style="font-size: 1.2rem; margin-bottom: 1rem;">Bean Groupings & Optimization</h2>
                <div id="bean-stats-container" style="display: flex; flex-direction: column; gap: 1rem;">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">No data recorded yet. Log your first cup to view optimizations.</p>
                </div>
            </div>
        </section>
    </div>

    <!-- MODAL: Taster Profile -->
    <div class="modal-backdrop" id="modal-profile">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModals()">×</button>
            <h2 style="font-size: 1.25rem;">Coffee Taster Profile</h2>
            <div id="profile-modal-body" style="display: flex; flex-direction: column; gap: 1rem; font-size: 0.95rem; line-height: 1.5;">
                <p>Loading profile...</p>
            </div>
        </div>
    </div>

    <!-- MODAL: Calendar Stack -->
    <div class="modal-backdrop" id="modal-calendar">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModals()">×</button>
            <div class="calendar-header">
                <h2 style="font-size: 1.25rem;" id="calendar-month-title">Brew Calendar</h2>
            </div>
            <div class="calendar-grid" id="calendar-grid-container">
                <!-- Generated via JS -->
            </div>
            <div id="calendar-day-cards" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem;">
                <!-- Cards for selected date will pop up here -->
            </div>
        </div>
    </div>

    <script>
        // State management & LocalStorage
        let db = JSON.parse(localStorage.getItem('brewlog_db')) || {
            beans: [],
            brews: []
        };

        // Active brewing session temporary storage
        let activeBrew = {
            beanId: null,
            beanName: '',
            roast: 'Medium',
            flavor: '',
            grind: 20,
            temp: 92,
            coffee: 15,
            water: 250,
            bloom: 'yes',
            poursCount: 2,
            phases: [],
            currentPhaseIdx: 0,
            totalTime: 0
        };

        let timerInterval = null;
        let totalTimerSeconds = 0;
        let phaseTimerSeconds = 0;
        let isTimerRunning = false;
        const circumference = 264; // 2 * PI * 42

        // Navigation
        function switchTab(tabId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`view-${tabId}`).classList.add('active');
            if (tabId === 'dashboard') {
                document.querySelector('nav .nav-btn').classList.add('active');
            } else if (tabId === 'stats') {
                document.querySelectorAll('nav .nav-btn')[1].classList.add('active');
                renderAnalytics();
            }

            if (tabId === 'log') {
                populateBeanDropdown();
                goToStep(1);
            }
        }

        // Dropdown handling
        function populateBeanDropdown() {
            const select = document.getElementById('bean-select');
            select.innerHTML = '<option value="new">+ Add New Bean</option>';
            db.beans.forEach((b, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = b.name;
                select.appendChild(opt);
            });
            handleBeanSelectChange();
        }

        function handleBeanSelectChange() {
            const val = document.getElementById('bean-select').value;
            const newFields = document.getElementById('new-bean-fields');
            const tipsContainer = document.getElementById('bean-tips-container');

            if (val === 'new') {
                newFields.style.display = 'flex';
                tipsContainer.style.display = 'none';
            } else {
                newFields.style.display = 'none';
                const selectedBeanName = db.beans[val].name;
                const pastBrews = db.brews.filter(b => b.beanName.toLowerCase() === selectedBeanName.toLowerCase());
                
                if (pastBrews.length > 0) {
                    let tipsHtml = `<strong>💡 Past Brew Insights for ${selectedBeanName}:</strong><br>`;
                    let acidicCount = 0;
                    let bitterCount = 0;
                    let lastGrind = pastBrews[0].grind;
                    let lastTemp = pastBrews[0].temp;

                    pastBrews.forEach(b => {
                        const notesLower = (b.notes || '').toLowerCase();
                        if (notesLower.includes('sour') || notesLower.includes('acidic') || notesLower.includes('under')) acidicCount++;
                        if (notesLower.includes('bitter') || notesLower.includes('astringent') || notesLower.includes('over')) bitterCount++;
                    });

                    if (acidicCount > bitterCount) {
                        tipsHtml += `- Previous cups noted acidity/sourness. Try grinding slightly finer (current avg around ${lastGrind}) or raising water temp (currently ${lastTemp}°C) for higher extraction.`;
                    } else if (bitterCount > acidicCount) {
                        tipsHtml += `- Previous cups noted bitterness. Try grinding coarser or lowering water temp slightly to reduce over-extraction.`;
                    } else {
                        tipsHtml += `- Average rating across ${pastBrews.length} brews is ${(pastBrews.reduce((acc,c)=>acc+c.rank,0)/pastBrews.length).toFixed(1)}/10. Recent grind: ${lastGrind}, Temp: ${lastTemp}°C.`;
                    }
                    tipsContainer.innerHTML = tipsHtml;
                    tipsContainer.style.display = 'block';
                } else {
                    tipsContainer.style.display = 'none';
                }
            }
        }

        function goToStep(stepNum) {
            // Stop timer if leaving timer view
            if (stepNum !== 3 && isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
            }

            document.getElementById('step-beans').classList.add('step-hidden');
            document.getElementById('step-params').classList.add('step-hidden');
            document.getElementById('step-timer').classList.add('step-hidden');
            document.getElementById('step-complete').classList.add('step-hidden');

            if (stepNum === 1) document.getElementById('step-beans').classList.remove('step-hidden');
            if (stepNum === 2) {
                const beanVal = document.getElementById('bean-select').value;
                if (beanVal === 'new') {
                    const name = document.getElementById('bean-name').value.trim();
                    if (!name) {
                        alert('Please enter a bean name.');
                        goToStep(1);
                        return;
                    }
                }
                document.getElementById('step-params').classList.remove('step-hidden');
            }
            if (stepNum === 3) {
                document.getElementById('step-timer').classList.remove('step-hidden');
            }
            if (stepNum === 4) {
                document.getElementById('step-complete').classList.remove('step-hidden');
            }
        }

        // Timer & Recipe Setup
        function startTimerSession() {
            const beanVal = document.getElementById('bean-select').value;
            if (beanVal === 'new') {
                activeBrew.beanName = document.getElementById('bean-name').value.trim();
                activeBrew.roast = document.getElementById('bean-roast').value;
                activeBrew.flavor = document.getElementById('bean-flavor').value.trim();
            } else {
                const b = db.beans[beanVal];
                activeBrew.beanName = b.name;
                activeBrew.roast = b.roast;
                activeBrew.flavor = b.flavor;
            }

            activeBrew.grind = parseFloat(document.getElementById('param-grind').value) || 20;
            activeBrew.temp = parseFloat(document.getElementById('param-temp').value) || 92;
            activeBrew.coffee = parseFloat(document.getElementById('param-coffee').value) || 15;
            activeBrew.water = parseFloat(document.getElementById('param-water').value) || 250;
            activeBrew.bloom = document.getElementById('param-bloom').value;
            activeBrew.poursCount = parseInt(document.getElementById('param-pours').value) || 2;

            activeBrew.phases = [];
            if (activeBrew.bloom === 'yes') {
                activeBrew.phases.push({ name: 'Bloom', color: '#D4C5B9' }); // Beige
            }
            for (let i = 1; i <= activeBrew.poursCount; i++) {
                activeBrew.phases.push({ name: `Pour ${i}`, color: '#BC6C25' }); // Terracotta
                activeBrew.phases.push({ name: `Drawdown ${i}`, color: '#606C38' }); // Olive
            }

            activeBrew.currentPhaseIdx = 0;
            totalTimerSeconds = 0;
            phaseTimerSeconds = 0;
            isTimerRunning = false;

            goToStep(3);
            resetRingSVG();
            updateTimerUI();
        }

        function resetRingSVG() {
            const svg = document.getElementById('ring-svg-element');
            const existingSegments = svg.querySelectorAll('.ring-segment');
            existingSegments.forEach(el => el.remove());
        }

        function updateTimerUI() {
            const phase = activeBrew.phases[activeBrew.currentPhaseIdx];
            if (phase) {
                document.getElementById('timer-status-instruction').textContent = `${phase.name} (${phaseTimerSeconds}s)`;
                document.getElementById('timer-phase-counter').textContent = `Phase ${activeBrew.currentPhaseIdx + 1} of ${activeBrew.phases.length}`;
            }
            document.getElementById('timer-action-label').textContent = isTimerRunning ? 'Next Phase' : 'Tap to Start';
            
            const mins = Math.floor(totalTimerSeconds / 60);
            const secs = totalTimerSeconds % 60;
            document.getElementById('timer-clock').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function handleTimerButtonPress() {
            if (!isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    totalTimerSeconds++;
                    phaseTimerSeconds++;
                    updateTimerUI();
                }, 1000);
            } else {
                // Manual lap / advance to next phase
                advanceTimerPhase();
            }
        }

        function advanceTimerPhase() {
            // Draw current phase segment proportionally based on elapsed phase seconds
            const phase = activeBrew.phases[activeBrew.currentPhaseIdx];
            const segmentDuration = Math.max(phaseTimerSeconds, 1);

            // Append completed segment to SVG ring cumulatively
            appendRingSegment(segmentDuration, phase.color);

            phaseTimerSeconds = 0;
            activeBrew.currentPhaseIdx++;

            if (activeBrew.currentPhaseIdx >= activeBrew.phases.length) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                goToStep(4);
            } else {
                updateTimerUI();
            }
        }

        function appendRingSegment(duration, color) {
            const svg = document.getElementById('ring-svg-element');
            
            // Calculate total time accumulated so far across all finished phases
            let pastSeconds = 0;
            for (let i = 0; i < activeBrew.currentPhaseIdx; i++) {
                // we approximate or store actual past durations
            }
            // For precise relative sizing on the circle, we scale against total elapsed seconds
            // Let's compute cumulative offsets cleanly:
            const allSegments = svg.querySelectorAll('.ring-segment');
            let currentOffsetUsed = 0;
            allSegments.forEach(seg => {
                const len = parseFloat(seg.getAttribute('data-length') || 0);
                currentOffsetUsed += len;
            });

            // To avoid complexity, let's map each segment proportionally or use simple stroke-dasharray arcs.
            // A robust way for continuous segments:
            const totalSoFar = totalTimerSeconds;
            const startDashOffset = circumference - (circumference * (Math.max(0, totalSoFar - duration) / Math.max(totalSoFar, 1)));
            const endDashOffset = circumference - (circumference * (totalSoFar / Math.max(totalSoFar, 1)));
            
            // Simpler reliable visual representation for live accumulation:
            // We can re-render all completed segments based on their exact time ratio relative to totalTimerSeconds
            
            renderAllCompletedSegments();
        }

        function renderAllCompletedSegments() {
            const svg = document.getElementById('ring-svg-element');
            const existingSegments = svg.querySelectorAll('.ring-segment');
            existingSegments.forEach(el => el.remove());

            // Let's track phase durations recorded
            if (!activeBrew.recordedDurations) activeBrew.recordedDurations = [];
            activeBrew.recordedDurations[activeBrew.currentPhaseIdx] = phaseTimerSeconds;

            const totalSum = activeBrew.recordedDurations.reduce((a, b) => a + (b || 0), 0);
            if (totalSum <= 0) return;

            let accumulated = 0;
            for (let i = 0; i <= activeBrew.currentPhaseIdx; i++) {
                const dur = activeBrew.recordedDurations[i] || 0;
                if (dur === 0) continue;

                const startRatio = accumulated / totalSum;
                accumulated += dur;
                const endRatio = accumulated / totalSum;

                const startDashOffset = circumference - (circumference * startRatio);
                const dashLength = circumference * (endRatio - startRatio);

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('class', 'ring-segment');
                circle.setAttribute('cx', '50');
                circle.setAttribute('cy', '50');
                circle.setAttribute('r', '42');
                circle.setAttribute('stroke', activeBrew.phases[i].color);
                circle.setAttribute('stroke-dasharray', `${dashLength} ${circumference}`);
                circle.setAttribute('stroke-dashoffset', `${startDashOffset}`);
                svg.appendChild(circle);
            }
        }

        function saveBrewCard() {
            const rank = parseFloat(document.getElementById('complete-rank').value) || 8;
            const notes = document.getElementById('complete-notes').value.trim();

            const newBrew = {
                id: Date.now(),
                date: new Date().toISOString().split('T')[0],
                beanName: activeBrew.beanName,
                roast: activeBrew.roast,
                flavor: activeBrew.flavor,
                grind: activeBrew.grind,
                temp: activeBrew.temp,
                coffee: activeBrew.coffee,
                water: activeBrew.water,
                totalTime: totalTimerSeconds,
                rank: rank,
                notes: notes
            };

            let existingBean = db.beans.find(b => b.name.toLowerCase() === activeBrew.beanName.toLowerCase());
            if (!existingBean) {
                db.beans.push({
                    name: activeBrew.beanName,
                    roast: activeBrew.roast,
                    flavor: activeBrew.flavor
                });
            }

            db.brews.unshift(newBrew);
            localStorage.setItem('brewlog_db', JSON.stringify(db));

            document.getElementById('complete-notes').value = '';
            switchTab('dashboard');
        }

        function renderAnalytics() {
            const container = document.getElementById('bean-stats-container');
            if (db.brews.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">No data recorded yet.</p>`;
                return;
            }

            const groups = {};
            db.brews.forEach(b => {
                if (!groups[b.beanName]) groups[b.beanName] = [];
                groups[b.beanName].push(b);
            });

            let html = '';
            for (let beanName in groups) {
                const brews = groups[beanName];
                const avgRank = brews.reduce((sum, c) => sum + c.rank, 0) / brews.length;
                const sortedByRank = [...brews].sort((a,b) => b.rank - a.rank);
                const optimalGrind = sortedByRank[0].grind;

                html += `
                    <div class="optimizer-box">
                        <div class="optimizer-title">${beanName} (${brews.length} cups logged)</div>
                        <div class="optimizer-text">
                            Average Rating: <strong>${avgRank.toFixed(1)}/10</strong><br>
                            💡 <strong>Optimization Suggestion:</strong> Your highest-rated cup used grind size <strong>${optimalGrind}</strong>. Suggest sticking around this setting!
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // Modals
        function openProfileModal() {
            const modal = document.getElementById('modal-profile');
            const body = document.getElementById('profile-modal-body');
            
            if (db.brews.length === 0) {
                body.innerHTML = `<p>Log some coffee cups to generate your taster profile.</p>`;
            } else {
                const regionCounts = {};
                db.brews.forEach(b => {
                    const region = b.beanName.split(' ')[0] || 'Unknown';
                    regionCounts[region] = (regionCounts[region] || 0) + 1;
                });
                let topRegion = Object.keys(regionCounts).reduce((a, b) => regionCounts[a] > regionCounts[b] ? a : b);

                const roastCounts = {};
                db.brews.forEach(b => roastCounts[b.roast] = (roastCounts[b.roast] || 0) + 1);
                let topRoast = Object.keys(roastCounts).reduce((a, b) => roastCounts[a] > roastCounts[b] ? a : b);

                const noteCounts = {};
                db.brews.forEach(b => {
                    if (b.flavor) {
                        b.flavor.split(',').forEach(tag => {
                            const clean = tag.trim().toLowerCase();
                            if (clean) noteCounts[clean] = (noteCounts[clean] || 0) + 1;
                        });
                    }
                    if (b.notes) {
                        b.notes.split(' ').forEach(word => {
                            const clean = word.replace(/[^a-zA-Z]/g, '').toLowerCase();
                            if (clean.length > 3) noteCounts[clean] = (noteCounts[clean] || 0) + 1;
                        });
                    }
                });

                const sortedNotes = Object.keys(noteCounts).sort((a,b) => noteCounts[b] - noteCounts[a]).slice(0, 3);

                body.innerHTML = `
                    <p>Compiled from your <strong>${db.brews.length}</strong> recorded brews:</p>
                    <ul style="padding-left: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem;">
                        <li><strong>Region:</strong> ${topRegion}</li>
                        <li><strong>Roast:</strong> ${topRoast}</li>
                        <li><strong>Top 3 Tasting Notes:</strong>
                            <ol style="padding-left: 1.25rem; margin-top: 0.25rem;">
                                <li>${sortedNotes[0] ? sortedNotes[0] : 'Balanced'}</li>
                                <li>${sortedNotes[1] ? sortedNotes[1] : 'Sweet'}</li>
                                <li>${sortedNotes[2] ? sortedNotes[2] : 'Clean'}</li>
                            </ol>
                        </li>
                    </ul>
                `;
            }
            modal.classList.add('active');
        }

        function openCalendarModal() {
            const modal = document.getElementById('modal-calendar');
            renderCalendarGrid();
            modal.classList.add('active');
        }

        function closeModals() {
            document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('active'));
        }

        function renderCalendarGrid() {
            const grid = document.getElementById('calendar-grid-container');
            const title = document.getElementById('calendar-month-title');
            
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            title.textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let html = `
                <div class="cal-day-header">Su</div>
                <div class="cal-day-header">Mo</div>
                <div class="cal-day-header">Tu</div>
                <div class="cal-day-header">We</div>
                <div class="cal-day-header">Th</div>
                <div class="cal-day-header">Fr</div>
                <div class="cal-day-header">Sa</div>
            `;

            for (let i = 0; i < firstDay; i++) {
                html += `<div class="cal-cell empty"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasBrew = db.brews.some(b => b.date === dateStr);
                
                html += `<div class="cal-cell ${hasBrew ? 'has-brew' : ''}" onclick="selectCalendarDate('${dateStr}')">${day}</div>`;
            }

            grid.innerHTML = html;
        }

        function selectCalendarDate(dateStr) {
            const container = document.getElementById('calendar-day-cards');
            const matchingBrews = db.brews.filter(b => b.date === dateStr);

            if (matchingBrews.length === 0) {
                container.innerHTML = `<p style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">No brews recorded on ${dateStr}.</p>`;
                return;
            }

            let html = `<h4 style="font-size: 0.95rem; margin-bottom: 0.5rem;">Brews on ${dateStr}:</h4>`;
            matchingBrews.forEach(brew => {
                html += `
                    <div class="coffee-card-item">
                        <div class="coffee-card-header">
                            <div>
                                <div class="coffee-card-bean">${brew.beanName}</div>
                                <div style="font-size: 0.75rem; color: var(--text-muted);">${brew.roast} Roast • ${brew.flavor || 'No flavor tags'}</div>
                            </div>
                            <div class="coffee-card-score">${brew.rank}/10</div>
                        </div>
                        <div class="coffee-card-meta">
                            <div>Grind: ${brew.grind} clicks</div>
                            <div>Ratio: ${brew.coffee}g / ${brew.water}g</div>
                            <div>Temp: ${brew.temp}°C</div>
                            <div>Time: ${Math.floor(brew.totalTime / 60)}m ${brew.totalTime % 60}s</div>
                        </div>
                        ${brew.notes ? `<div class="coffee-card-notes">"${brew.notes}"</div>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
