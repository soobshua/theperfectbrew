<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Pour-Over Master Tracker</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #2c2522;
            --text-muted: #786f6a;
            --accent: #8b5a2b;
            --accent-hover: #6f4520;
            --border-color: #e3ded5;
            --shadow: 0 4px 16px rgba(44, 37, 34, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 40px;
        }

        /* Navigation Header - Home on Upper Right */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .step-panel {
            display: none;
        }

        .step-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            background: var(--border-color);
            cursor: not-allowed;
        }

        /* Timer UI */
        .timer-display-box {
            text-align: center;
            padding: 24px 0;
            background: #faf8f5;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        #timer-clock {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        #timer-stage-indicator {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
        }

        #timer-status-instruction {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Compound Multi-Colored Bar */
        .compound-bar-wrapper {
            margin: 20px 0;
        }

        .compound-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        #compound-bar-container {
            display: flex;
            height: 12px;
            width: 100%;
            background: var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            gap: 2px;
        }

        .bar-segment {
            height: 100%;
            transition: width 0.3s ease;
        }

        /* Cards & Grouping */
        .suggestion-card {
            background: #fff8f0;
            border-left: 4px solid var(--accent);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .item-card {
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            background: #fff;
        }

        .item-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .item-card-header strong {
            color: var(--accent);
            font-size: 0.95rem;
        }

        .badge {
            font-size: 0.7rem;
            background: #faf8f5;
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .card-actions button {
            margin-top: 0;
            padding: 6px 10px;
            font-size: 0.8rem;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .card-actions button:hover {
            background: var(--accent);
            color: white;
        }

        .card-actions button.danger {
            color: #b22222;
            border-color: #b22222;
        }

        .card-actions button.danger:hover {
            background: #b22222;
            color: white;
        }

        .group-header {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
            margin: 18px 0 8px 0;
            padding-bottom: 4px;
            border-bottom: 1px dashed var(--border-color);
        }

        /* Taster Profile Dashboard Stats */
        .profile-stat-box {
            background: #faf8f5;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
            font-size: 0.85rem;
        }

        .profile-stat-box h3 {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .ranked-list {
            padding-left: 18px;
            margin-top: 4px;
        }

        .ranked-list li {
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>Precision Pour-Over</h1>
        <div class="nav-links">
            <a id="nav-beans" onclick="attemptNav(5)">Beans</a>
            <a id="nav-profile" onclick="attemptNav(6)">Profile</a>
            <a id="nav-history" onclick="attemptNav(4)">History</a>
            <a id="nav-brew" onclick="attemptNav(1)" class="active">Home</a>
        </div>
    </div>
    <div class="subtitle" id="top-subtitle">Log, Time, and Refine Your Brews</div>

    <!-- STEP 1: BREW PARAMETERS (HOME) -->
    <div id="step-1" class="step-panel active">
        <div class="form-group">
            <label>Bean Selection</label>
            <select id="bean-select" onchange="checkBeanSelect()">
                <option value="" disabled selected>-- Select a Bean Profile --</option>
                <option value="new">+ Add New Bean Profile</option>
            </select>
        </div>

        <div id="new-bean-section" style="display: none; background: #faf8f5; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color);">
            <div class="form-group">
                <label>Bean Name & Country (e.g., Ethiopia Yirgacheffe)</label>
                <input type="text" id="bean-name" placeholder="e.g. Yirgacheffe (Ethiopia)">
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Roast Level</label>
                    <select id="bean-roast">
                        <option value="Light">Light</option>
                        <option value="Medium-Light">Medium-Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Medium-Dark">Medium-Dark</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Flavor Profile Tag</label>
                    <select id="bean-flavor-type">
                        <option value="Fruity">Fruity</option>
                        <option value="Nutty">Nutty</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 8px;">
                <label>Specific Tasting Notes (comma separated)</label>
                <input type="text" id="bean-flavor" placeholder="e.g. Peach, Chocolate, Vanilla">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Grind Setting (Clicks)</label>
                <input type="number" id="param-grind" value="21">
            </div>
            <div class="form-group">
                <label>Water Temp (°C)</label>
                <input type="number" id="param-temp" value="92">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Coffee Dose (g)</label>
                <input type="number" id="param-coffee" value="15">
            </div>
            <div class="form-group">
                <label>Water Weight (g)</label>
                <input type="number" id="param-water" value="250">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Use Bloom Phase?</label>
                <select id="param-bloom">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="form-group">
                <label>Number of Pours</label>
                <input type="number" id="param-pours" value="3">
            </div>
        </div>

        <button onclick="startTimerSetup()" id="proceed-brew-btn" disabled>Proceed to Stopwatch</button>
    </div>

    <!-- STEP 2: MANUAL CHECKPOINT STOPWATCH -->
    <div id="step-2" class="step-panel">
        <div class="timer-display-box">
            <div id="timer-clock">0:00</div>
            <div id="timer-stage-indicator">Stage: Ready</div>
            <div id="timer-status-instruction">Tap below to initiate sequence</div>
        </div>

        <div class="compound-bar-wrapper">
            <div class="compound-bar-label">
                <span>Phase Breakdown Distribution</span>
                <span id="total-logged-time">0s total</span>
            </div>
            <div id="compound-bar-container">
                <div class="bar-segment" style="width: 100%; background: var(--border-color); opacity: 0.4;"></div>
            </div>
        </div>

        <button id="timer-action-btn" onclick="handlePourOrFinishPress()">Start Bloom</button>
        <button onclick="attemptNav(1)" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: 8px;">Cancel / Edit Params</button>
    </div>

    <!-- STEP 3: RATING & OPTIMIZATION TIPS -->
    <div id="step-3" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Brew Complete Analysis & Tips</h2>
        
        <div id="analytics-suggestions-box"></div>

        <div class="form-group">
            <label>Overall Cup Score (1 - 10)</label>
            <input type="number" id="cup-score" min="1" max="10" value="8" step="0.1">
        </div>

        <div class="form-group">
            <label>Tasting Notes & Observations (comma separated)</label>
            <textarea id="cup-notes" rows="3" placeholder="Peach, floral, clean finish..."></textarea>
        </div>

        <button onclick="saveBrewSession()">Save & Return Home</button>
    </div>

    <!-- STEP 4: HISTORY (GROUPED BY BEAN) -->
    <div id="step-4" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Logged Brew History</h2>
        <div id="history-list-container"></div>
        <button onclick="attemptNav(1)">Back to Home</button>
    </div>

    <!-- STEP 5: BEAN MANAGER -->
    <div id="step-5" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Bean Inventory Manager</h2>
        
        <div style="background: #faf8f5; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color);">
            <div class="form-group" style="margin-bottom: 10px;">
                <label id="bean-form-title">Add New Bean Inventory</label>
                <input type="text" id="mgr-name" placeholder="Bean Name & Country (e.g., Yirgacheffe (Ethiopia))">
            </div>
            <div class="row" style="margin-bottom: 10px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Roast Level</label>
                    <select id="mgr-roast">
                        <option value="Light">Light</option>
                        <option value="Medium-Light">Medium-Light</option>
                        <option value="Medium">Medium</option>
                        <option value="Medium-Dark">Medium-Dark</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Flavor Profile Tag</label>
                    <select id="mgr-flavor-type">
                        <option value="Fruity">Fruity</option>
                        <option value="Nutty">Nutty</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top: 8px;">
                <label>Specific Tasting Notes</label>
                <input type="text" id="mgr-flavor" placeholder="e.g. Peach, Chocolate, Vanilla">
            </div>
            <input type="hidden" id="mgr-edit-id" value="">
            <button onclick="saveBeanFromManager()" id="mgr-save-btn" style="margin-top: 10px;">Save Bean Profile</button>
            <button id="mgr-cancel-btn" onclick="resetBeanManagerForm()" style="display:none; background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: 6px;">Cancel Edit</button>
        </div>

        <div id="bean-manager-list"></div>
        <button onclick="attemptNav(1)" style="margin-top: 16px;">Back to Home</button>
    </div>

    <!-- STEP 6: COFFEE TASTER PROFILE DASHBOARD -->
    <div id="step-6" class="step-panel">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--accent);">Coffee Taster Profile & Preferences</h2>
        <div id="taster-profile-content"></div>
        <button onclick="attemptNav(1)" style="margin-top: 16px;">Back to Home</button>
    </div>
</div>

<script>
    const db = {
        beans: JSON.parse(localStorage.getItem('pour_over_beans')) || [],
        sessions: JSON.parse(localStorage.getItem('pour_over_sessions')) || []
    };

    function persistData() {
        localStorage.setItem('pour_over_beans', JSON.stringify(db.beans));
        localStorage.setItem('pour_over_sessions', JSON.stringify(db.sessions));
    }

    let activeBrew = {};
    let brewPhases = [];
    let currentPhaseIndex = 0;
    let currentPhaseSeconds = 0;
    let stopwatchSeconds = 0;
    let stopwatchInterval = null;
    let isStopwatchRunning = false;
    let currentStep = 1;

    const phaseColors = ['#8b5a2b', '#c29b61', '#d4b58a', '#e8d5b5', '#6f4520', '#a37042', '#b88654'];

    // Warn before closing browser tab if active
    window.addEventListener('beforeunload', (e) => {
        if (isStopwatchRunning || currentStep === 2) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    function attemptNav(stepNum) {
        if (currentStep === 2 && stepNum !== 2) {
            if (!confirm("Are you sure you want to leave this page? Active timer progress will be lost.")) return;
            if (stopwatchInterval) clearInterval(stopwatchInterval);
            isStopwatchRunning = false;
        }
        goToStep(stepNum);
    }

    function goToStep(stepNum) {
        currentStep = stepNum;
        document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`step-${stepNum}`).classList.add('active');

        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        if (stepNum === 1 || stepNum === 2 || stepNum === 3) document.getElementById('nav-brew').classList.add('active');
        if (stepNum === 4) document.getElementById('nav-history').classList.add('active');
        if (stepNum === 5) document.getElementById('nav-beans').classList.add('active');
        if (stepNum === 6) document.getElementById('nav-profile').classList.add('active');

        const subtitles = {
            1: "Log, Time, and Refine Your Brews",
            2: "Manual Checkpoint Stopwatch Mode",
            3: "Performance Insights & Cup Optimization",
            4: "Grouped Brew History & Best Cup Stats",
            5: "Organize, Edit, and Archive Your Bean Stash",
            6: "Your Analytical Taster Dashboard & Ranked Preferences"
        };
        document.getElementById('top-subtitle').textContent = subtitles[stepNum];

        if (stepNum === 1) updateBeanSelectDropdown();
        if (stepNum === 2) initStopwatchSession();
        if (stepNum === 4) renderHistoryList();
        if (stepNum === 5) renderBeanManager();
        if (stepNum === 6) renderTasterProfile();
    }

    function updateBeanSelectDropdown(selectedName = "") {
        const select = document.getElementById('bean-select');
        select.innerHTML = '<option value="" disabled selected>-- Select a Bean Profile --</option>';

        const activeBeans = db.beans.filter(b => !b.archived);
        activeBeans.forEach((b) => {
            const opt = document.createElement('option');
            opt.value = b.id;
            opt.textContent = `${b.name} (${b.roast} - ${b.flavorType || 'Fruity'})`;
            if (b.name === selectedName) opt.selected = true;
            select.appendChild(opt);
        });

        const newOpt = document.createElement('option');
        newOpt.value = 'new';
        newOpt.textContent = '+ Add New Bean Profile';
        select.appendChild(newOpt);

        checkBeanSelect();
    }

    function checkBeanSelect() {
        const val = document.getElementById('bean-select').value;
        const newSec = document.getElementById('new-bean-section');
        const btn = document.getElementById('proceed-brew-btn');

        if (val === 'new') {
            newSec.style.display = 'block';
            btn.disabled = false;
        } else if (val === '') {
            newSec.style.display = 'none';
            btn.disabled = true;
        } else {
            newSec.style.display = 'none';
            btn.disabled = false;
        }
    }

    function startTimerSetup() {
        const val = document.getElementById('bean-select').value;
        if (val === '') return;
        goToStep(2);
    }

    // Bean Manager & Edit Fix
    function renderBeanManager() {
        const container = document.getElementById('bean-manager-list');
        if (db.beans.length === 0) {
            container.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom:16px;">No beans added yet.</p>';
            return;
        }

        let html = '';
        db.beans.forEach((b) => {
            html += `
                <div class="item-card" style="${b.archived ? 'opacity: 0.6; background: #faf8f5;' : ''}">
                    <div class="item-card-header">
                        <strong>${b.name}</strong>
                        <span class="badge">${b.roast} | ${b.flavorType || 'Fruity'} ${b.archived ? '(Archived)' : ''}</span>
                    </div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px;">
                        Notes: ${b.flavor || 'None'}
                    </div>
                    <div class="card-actions">
                        <button onclick="editBean('${b.id}')">Edit</button>
                        <button onclick="toggleArchiveBean('${b.id}')" class="danger">${b.archived ? 'Unarchive' : 'Archive'}</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function saveBeanFromManager() {
        const name = document.getElementById('mgr-name').value.trim();
        const roast = document.getElementById('mgr-roast').value;
        const flavorType = document.getElementById('mgr-flavor-type').value;
        const flavor = document.getElementById('mgr-flavor').value.trim();
        const editId = document.getElementById('mgr-edit-id').value;

        if (!name) {
            alert('Please enter a bean name and origin.');
            return;
        }

        if (!editId) {
            const newBean = { id: 'bean_' + Date.now(), name, roast, flavorType, flavor, archived: false };
            db.beans.push(newBean);
        } else {
            const b = db.beans.find(x => x.id === editId);
            if (b) {
                b.name = name;
                b.roast = roast;
                b.flavorType = flavorType;
                b.flavor = flavor;
            }
        }

        persistData();
        resetBeanManagerForm();
        renderBeanManager();
    }

    function editBean(id) {
        const b = db.beans.find(x => x.id === id);
        if (!b) return;
        document.getElementById('mgr-name').value = b.name;
        document.getElementById('mgr-roast').value = b.roast;
        document.getElementById('mgr-flavor-type').value = b.flavorType || 'Fruity';
        document.getElementById('mgr-flavor').value = b.flavor || '';
        document.getElementById('mgr-edit-id').value = id;
        document.getElementById('bean-form-title').textContent = 'Edit Bean Profile';
        document.getElementById('mgr-save-btn').textContent = 'Update Bean Profile';
        document.getElementById('mgr-cancel-btn').style.display = 'block';
    }

    function resetBeanManagerForm() {
        document.getElementById('mgr-name').value = '';
        document.getElementById('mgr-flavor').value = '';
        document.getElementById('mgr-edit-id').value = '';
        document.getElementById('bean-form-title').textContent = 'Add New Bean Inventory';
        document.getElementById('mgr-save-btn').textContent = 'Save Bean Profile';
        document.getElementById('mgr-cancel-btn').style.display = 'none';
    }

    function toggleArchiveBean(id) {
        const b = db.beans.find(x => x.id === id);
        if (b) {
            b.archived = !b.archived;
            persistData();
            renderBeanManager();
        }
    }

    // Stopwatch & Auto-Log
    function initStopwatchSession() {
        const beanVal = document.getElementById('bean-select').value;
        if (beanVal === 'new') {
            const name = document.getElementById('bean-name').value.trim() || 'Custom Bean (Ethiopia)';
            const roast = document.getElementById('bean-roast').value;
            const flavorType = document.getElementById('bean-flavor-type').value;
            const flavor = document.getElementById('bean-flavor').value.trim();
            
            const newBean = { id: 'bean_' + Date.now(), name, roast, flavorType, flavor, archived: false };
            db.beans.push(newBean);
            persistData();
            activeBrew.beanName = name;
        } else {
            const b = db.beans.find(x => x.id === beanVal);
            activeBrew.beanName = b ? b.name : 'Unknown Bean';
        }

        activeBrew.grind = parseFloat(document.getElementById('param-grind').value) || 21;
        activeBrew.temp = parseFloat(document.getElementById('param-temp').value) || 92;
        activeBrew.coffee = parseFloat(document.getElementById('param-coffee').value) || 15;
        activeBrew.water = parseFloat(document.getElementById('param-water').value) || 250;
        activeBrew.bloom = document.getElementById('param-bloom').value;
        activeBrew.pours = parseInt(document.getElementById('param-pours').value) || 3;

        brewPhases = [];
        let colorIdx = 0;

        if (activeBrew.bloom === 'Yes') {
            brewPhases.push({ name: 'Bloom', duration: 0, color: phaseColors[colorIdx++ % phaseColors.length] });
            brewPhases.push({ name: 'Bloom Pause', duration: 0, color: phaseColors[colorIdx++ % phaseColors.length] });
        }

        for (let i = 1; i <= activeBrew.pours; i++) {
            brewPhases.push({ name: `Pour ${i}`, duration: 0, color: phaseColors[colorIdx++ % phaseColors.length] });
            if (i < activeBrew.pours) {
                brewPhases.push({ name: `Pause ${i}`, duration: 0, color: phaseColors[colorIdx++ % phaseColors.length] });
            }
        }

        brewPhases.push({ name: 'Final Drawdown', duration: 0, color: phaseColors[colorIdx++ % phaseColors.length] });

        currentPhaseIndex = 0;
        currentPhaseSeconds = 0;
        stopwatchSeconds = 0;
        isStopwatchRunning = false;
        if (stopwatchInterval) clearInterval(stopwatchInterval);

        const actionBtn = document.getElementById('timer-action-btn');
        actionBtn.style.width = '100%';
        actionBtn.disabled = false;
        actionBtn.textContent = `Start ${brewPhases[0].name}`;
        
        document.getElementById('timer-stage-indicator').textContent = 'Stage: Ready';
        document.getElementById('timer-status-instruction').textContent = `Tap to start ${brewPhases[0].name}`;

        updateCompoundBarUI();
    }

    function handlePourOrFinishPress() {
        if (!isStopwatchRunning) {
            isStopwatchRunning = true;
            if (stopwatchInterval) clearInterval(stopwatchInterval);
            
            stopwatchInterval = setInterval(() => {
                stopwatchSeconds++;
                currentPhaseSeconds++;
                if (brewPhases[currentPhaseIndex]) {
                    brewPhases[currentPhaseIndex].duration = currentPhaseSeconds;
                }
                updateCompoundBarUI();
            }, 1000);

            currentPhaseIndex++;
            if (currentPhaseIndex < brewPhases.length) {
                document.getElementById('timer-action-btn').textContent = `Start ${brewPhases[currentPhaseIndex].name}`;
                document.getElementById('timer-status-instruction').textContent = `Active: ${brewPhases[currentPhaseIndex - 1].name} in progress...`;
            } else {
                document.getElementById('timer-action-btn').textContent = `Complete Brew`;
            }
            updateCompoundBarUI();
            return;
        }

        if (currentPhaseIndex < brewPhases.length) {
            brewPhases[currentPhaseIndex - 1].duration = currentPhaseSeconds;
            currentPhaseSeconds = 0;
            
            const activePhase = brewPhases[currentPhaseIndex];
            document.getElementById('timer-status-instruction').textContent = `Active: ${activePhase.name} in progress...`;

            currentPhaseIndex++;
            if (currentPhaseIndex < brewPhases.length) {
                document.getElementById('timer-action-btn').textContent = `Start ${brewPhases[currentPhaseIndex].name}`;
            } else {
                document.getElementById('timer-action-btn').textContent = `Complete Brew`;
            }
        } else {
            if (stopwatchInterval) clearInterval(stopwatchInterval);
            isStopwatchRunning = false;
            brewPhases[brewPhases.length - 1].duration = currentPhaseSeconds;
            
            generateAnalyticsSuggestions();
            goToStep(3);
        }
        updateCompoundBarUI();
    }

    function updateCompoundBarUI() {
        const mins = Math.floor(stopwatchSeconds / 60);
        const secs = stopwatchSeconds % 60;
        document.getElementById('timer-clock').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        document.getElementById('total-logged-time').textContent = `${stopwatchSeconds}s total`;

        if (isStopwatchRunning && currentPhaseIndex > 0 && currentPhaseIndex <= brewPhases.length) {
            const activeName = brewPhases[currentPhaseIndex - 1].name;
            document.getElementById('timer-stage-indicator').textContent = `${activeName}: ${currentPhaseSeconds}s`;
        } else if (!isStopwatchRunning && stopwatchSeconds === 0) {
            document.getElementById('timer-stage-indicator').textContent = `Stage: Ready`;
        }

        const container = document.getElementById('compound-bar-container');
        const totalDuration = Math.max(stopwatchSeconds, 1);

        let html = '';
        brewPhases.forEach((phase, idx) => {
            const dur = phase.duration || (isStopwatchRunning && idx === currentPhaseIndex - 1 ? currentPhaseSeconds : 0);
            if (dur > 0) {
                const pct = Math.max((dur / totalDuration) * 100, 3);
                html += `<div class="bar-segment" style="width: ${pct}%; background: ${phase.color};" title="${phase.name}: ${dur}s"></div>`;
            }
        });

        if (!html) {
            html = `<div class="bar-segment" style="width: 100%; background: var(--border-color); opacity: 0.4;"></div>`;
        }
        container.innerHTML = html;
    }

    function generateAnalyticsSuggestions() {
        let suggestionsHTML = '';
        const bloomPhase = brewPhases.find(p => p.name === 'Bloom');
        const bloomDur = bloomPhase ? bloomPhase.duration : 0;
        const drawdownPhase = brewPhases.find(p => p.name === 'Final Drawdown');
        const drawdownDur = drawdownPhase ? drawdownPhase.duration : 0;

        if (bloomDur > 45) {
            suggestionsHTML += `<div class="suggestion-card">💡 <strong>Tip to Optimise:</strong> Change Parameter Grind & Bloom duration; try shortening the bloom by 10s to improve extraction clarity.</div>`;
        } else if (bloomDur > 0 && bloomDur < 25) {
            suggestionsHTML += `<div class="suggestion-card">💡 <strong>Tip to Optimise:</strong> Change Parameter Water Temp & Bloom duration; extend your bloom slightly to improve degassing and sweetness.</div>`;
        }

        if (drawdownDur > 90) {
            suggestionsHTML += `<div class="suggestion-card">💡 <strong>Tip to Optimise:</strong> Change Parameter Grind (coarser by 2-3 clicks) to improve drawdown speed and reduce bitterness.</div>`;
        } else if (drawdownDur > 0 && drawdownDur < 35) {
            suggestionsHTML += `<div class="suggestion-card">💡 <strong>Tip to Optimise:</strong> Change Parameter Grind (finer by 2 clicks) to improve body and avoid watery extraction.</div>`;
        }

        if (!suggestionsHTML) {
            suggestionsHTML = `<div class="suggestion-card">✨ <strong>Great Brew Profile!</strong> Your extraction parameters and pouring timing landed within ideal extraction specs.</div>`;
        }

        document.getElementById('analytics-suggestions-box').innerHTML = suggestionsHTML;
    }

    function saveBrewSession() {
        activeBrew.score = parseFloat(document.getElementById('cup-score').value) || 8.0;
        activeBrew.notes = document.getElementById('cup-notes').value;
        activeBrew.phases = [...brewPhases];
        activeBrew.totalTime = stopwatchSeconds;
        activeBrew.date = new Date().toLocaleDateString();
        activeBrew.id = 'session_' + Date.now();

        db.sessions.unshift(activeBrew);
        persistData();
        goToStep(1);
    }

    // History grouped by bean with Best Cup stats & Edit support
    function renderHistoryList() {
        const container = document.getElementById('history-list-container');
        if (db.sessions.length === 0) {
            container.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted);">No archived brews found.</p>';
            return;
        }

        // Group sessions by beanName
        const groups = {};
        db.sessions.forEach(s => {
            const bName = s.beanName || 'Unknown Bean';
            if (!groups[bName]) groups[bName] = [];
            groups[bName].push(s);
        });

        let html = '';
        Object.keys(groups).forEach(beanName => {
            const sessions = groups[beanName];
            const avgScore = sessions.reduce((acc, s) => acc + s.score, 0) / sessions.length;
            // Find best cup in this group
            const bestCup = sessions.reduce((best, s) => s.score > best.score ? s : best, sessions[0]);

            html += `<div class="group-header">☕ ${beanName}</div>`;
            html += `<div style="font-size: 0.8rem; color: var(--accent); font-weight:600; margin-bottom: 6px;">Score: ${avgScore.toFixed(2)}/10 (avg over ${sessions.length} cup${sessions.length > 1 ? 's' : ''})</div>`;
            
            if (bestCup) {
                const pourSummary = bestCup.phases ? bestCup.phases.map(p => `${p.name}: ${p.duration}s`).join(' | ') : '';
                html += `
                    <div style="background: #faf8f5; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 12px; font-size: 0.78rem; margin-bottom: 8px;">
                        🏆 <strong>Best Cup Stats:</strong> Grind: ${bestCup.grind} | Temp: ${bestCup.temp}°C | Water: ${bestCup.water}g | Total: ${bestCup.totalTime}s (${bestCup.pours} pours, Bloom: ${bestCup.bloom})<br>
                        <em>Phases: ${pourSummary}</em>
                    </div>
                `;
            }

            sessions.forEach(s => {
                html += `
                    <div class="item-card" id="history-card-${s.id}">
                        <div class="item-card-header">
                            <span>Score: <strong>${s.score.toFixed(1)}/10</strong> (${s.date})</span>
                        </div>
                        <div style="color:var(--text-muted); font-size:0.8rem; margin-bottom:6px;">
                            Grind: ${s.grind} | Temp: ${s.temp}°C | Water: ${s.water}g | Total: ${s.totalTime}s (${s.pours} pours, Bloom: ${s.bloom})
                        </div>
                        <div style="font-style:italic; font-size:0.8rem; margin-bottom:6px;">"${s.notes || 'No notes'}"</div>
                        <div class="card-actions">
                            <button onclick="editHistorySession('${s.id}')">Edit Log</button>
                        </div>
                    </div>
                `;
            });
        });

        container.innerHTML = html;
    }

    function editHistorySession(id) {
        const s = db.sessions.find(x => x.id === id);
        if (!s) return;
        const card = document.getElementById(`history-card-${id}`);
        card.innerHTML = `
            <div class="form-group" style="margin-bottom:8px;">
                <label>Edit Score (1 - 10)</label>
                <input type="number" id="edit-score-${id}" value="${s.score}" min="1" max="10" step="0.1">
            </div>
            <div class="form-group" style="margin-bottom:8px;">
                <label>Edit Tasting Notes</label>
                <input type="text" id="edit-notes-${id}" value="${s.notes || ''}">
            </div>
            <div class="card-actions">
                <button onclick="saveEditedSession('${id}')">Save</button>
                <button onclick="renderHistoryList()" class="danger">Cancel</button>
            </div>
        `;
    }

    function saveEditedSession(id) {
        const s = db.sessions.find(x => x.id === id);
        if (s) {
            s.score = parseFloat(document.getElementById(`edit-score-${id}`).value) || s.score;
            s.notes = document.getElementById(`edit-notes-${id}`).value;
            persistData();
            renderHistoryList();
        }
    }

    // Taster Profile Dashboard
    function renderTasterProfile() {
        const container = document.getElementById('taster-profile-content');
        if (db.sessions.length === 0) {
            container.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted);">No completed brews recorded yet. Log some cups to generate your profile!</p>';
            return;
        }

        const roastCounts = {};
        const countryCounts = {};
        const noteCounts = {};

        db.sessions.forEach(s => {
            const matchingBean = db.beans.find(b => b.name === s.beanName) || {};
            const roast = matchingBean.roast || 'Light';
            const flavorTag = matchingBean.flavorType || 'Fruity';
            const roastKey = `${roast} + ${flavorTag}`;
            roastCounts[roastKey] = (roastCounts[roastKey] || 0) + 1;

            // Extract country inside parentheses or fallback
            const nameStr = s.beanName || '';
            const match = nameStr.match(/\(([^)]+)\)/);
            const country = match ? match[1].trim() : 'Ethiopia';
            countryCounts[country] = (countryCounts[country] || 0) + 1;

            if (s.notes) {
                s.notes.split(',').forEach(n => {
                    const cleanNote = n.trim().toLowerCase();
                    if (cleanNote) {
                        noteCounts[cleanNote] = (noteCounts[cleanNote] || 0) + 1;
                    }
                });
            }
        });

        const favRoast = Object.keys(roastCounts).reduce((a, b) => roastCounts[a] > roastCounts[b] ? a : b, 'Light + Fruity');
        const favCountry = Object.keys(countryCounts).reduce((a, b) => countryCounts[a] > countryCounts[b] ? a : b, 'Ethiopia');

        const sortedNotes = Object.keys(noteCounts).sort((a, b) => noteCounts[b] - noteCounts[a]);
        const top3Notes = sortedNotes.slice(0, 3);

        container.innerHTML = `
            <div class="profile-stat-box">
                <h3>☕ Favorite Roast Style</h3>
                <p><strong>${favRoast}</strong></p>
            </div>
            <div class="profile-stat-box">
                <h3>🌍 Favorite Origin Country</h3>
                <p><strong>${favCountry.charAt(0).toUpperCase() + favCountry.slice(1)}</strong></p>
            </div>
            <div class="profile-stat-box">
                <h3>🏆 Top 3 Ranked Tasting Notes</h3>
                ${top3Notes.length > 0 ? `
                    <ol class="ranked-list">
                        ${top3Notes.map((n, idx) => `<li><strong>${idx + 1}. ${n.charAt(0).toUpperCase() + n.slice(1)}</strong> (${noteCounts[n]} occurrences)</li>`).join('')}
                    </ol>
                ` : '<p style="font-size:0.8rem; color:var(--text-muted);">No notes recorded yet.</p>'}
            </div>
        `;
    }

    updateBeanSelectDropdown();
</script>
